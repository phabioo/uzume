  /api/v1/plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: Plugin versions this server offers to apps (`plugins_v1`, any trusted device)
      description: |
        Every offered version of every plugin, ordered by `plugin_id` and SemVer (oldest first). `origin` is `official`
        (valid Uzume signature) or `unverified` (unsigned, offered by the admin). `requires`, `provides` and
        `games` are copied from the manifest and empty when absent. `sha256` is the digest of the file served by
        `getPluginFile`; the app pins it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Offered plugin versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginList' }
              examples:
                default:
                  value:
                    plugins:
                      - plugin_id: net.example.tracker
                        version: 1.2.0
                        name: Tracker
                        description: Tracks things
                        api: 1
                        origin: official
                        sha256: '3333333333333333333333333333333333333333333333333333333333333333'
                        size: 12345
                        permissions: [memory.read, ui]
                        requires: { net.example.base: ^1.0 }
                        provides: [tracker.state]
                        games: [{ system: nds, codes: ['IPK*'] }]
                        created_at: '2026-10-12T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/plugins/{plugin_id}/store:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: listPluginStore
      tags: [plugins]
      summary: The keys of the caller's own store of a plugin (`plugin_store_v1`)
      description: |
        The plugin user store (`fb.store` of the plugin API) holds JSON values per person and plugin id, so that they follow
        the person to every PC. This lists the keys with revision and size, without the values (for the sync of the app).
        Values are visible to their owner only; no admin reads them. An unknown plugin id is an empty list.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginStoreList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/plugins/{plugin_id}/store/{key}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - $ref: '#/components/parameters/PluginStoreKey'
    get:
      operationId: getPluginStoreValue
      tags: [plugins]
      summary: One value of the caller's store (`plugin_store_v1`)
      description: 404 when the key does not exist.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginStoreValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putPluginStoreValue
      tags: [plugins]
      summary: Write a value against a base revision (`plugin_store_v1`)
      description: |
        `base_revision` must equal the current `revision` of the key (0 when the key does not exist yet), otherwise 409
        `store_conflict` with the current `revision` and `value`; the app keeps both versions. `value` is any JSON value of at
        most 256 KiB (compact form; 413 `payload_too_large` above that). One plugin may hold at most 16 MiB and 1024 keys per
        person (413 `store_quota_exceeded`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginStorePut' }
            examples:
              default: { value: { base_revision: 0, value: { lists: [] } } }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginStoreEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`store_conflict` (carries the current revision and value)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginStoreConflictError' }
        '413':
          description: The value is too large (`payload_too_large`) or the store of this plugin is full (`store_quota_exceeded`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deletePluginStoreValue
      tags: [plugins]
      summary: Delete a key (`plugin_store_v1`)
      description: With `base_revision` the delete is conditional like a write (409 `store_conflict` when the key has moved on); without it the key goes whatever its revision. 404 when the key does not exist.
      security:
        - bearerAuth: []
      parameters:
        - name: base_revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`store_conflict` (carries the current revision and value)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginStoreConflictError' }
  /api/v1/plugins/{plugin_id}/{version}/file:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - $ref: '#/components/parameters/PluginVersion'
    get:
      operationId: getPluginFile
      tags: [plugins]
      summary: Download the `.fbplugin` file of an offered plugin version (`plugins_v1`, any trusted device)
      security:
