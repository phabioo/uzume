  /api/v1/variants:
    get:
      operationId: listVariants
      tags: [variants]
      summary: The caller's own variants of all games (`variants_v1`)
      description: Only the caller's variants. Variants that were deleted with their saves kept (recipe kept) only with `include_deleted=1`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Variants, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/variants/{variant_id}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    patch:
      operationId: renameVariant
      tags: [variants]
      summary: Rename an own variant (`variants_v1`)
      description: The slot and the recipe stay. 409 `name_taken` when the caller has an active variant of the game with that name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantRenameRequest' }
      responses:
        '200':
          description: The variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VariantConflict' }
    delete:
      operationId: deleteVariant
      tags: [variants]
      summary: Delete an own variant (`variants_v1`)
      description: |
        `saves=keep` (default) marks the variant deleted and keeps the recipe and the save slot ("Build it again"); a deleted
        variant no longer pins its tool version. `saves=delete` deletes the caller's save slot of the variant with the same rules as
        deleting a slot (409 `session_running` while a Session of the game runs, 409 `conflict` while a save conflict of the slot is open;
        nothing is deleted then) and removes the recipe for good.
      security:
        - bearerAuth: []
      parameters:
        - name: saves
          in: query
          required: false
          schema: { type: string, enum: [keep, delete], default: keep }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VariantConflict' }
  /api/v1/games/{game_id}/variants:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: listGameVariants
      tags: [variants]
      summary: The caller's own variants of one game (`variants_v1`)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Variants, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createVariant
      tags: [variants]
      summary: Store a variant recipe for a game (`variants_v1`)
      description: |
        The server stores the recipe only; the app builds the variant. `tool_version` must be in the catalog (it may be a version
        that is not offered, so old recipes stay valid). Name 1 to 48 characters, unique per person and game among active variants
        (409 `name_taken`); `settings` 1 to 4096 printable ASCII characters; `seed` a non-negative 63-bit integer.
        `base_sha256` pins the base dump (Gen 1 to 5), `title_id` the 3DS title, `update_version` the 3DS update.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantCreateRequest' }
      responses:
        '201':
          description: The variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VariantConflict' }
  /api/v1/saves:
    get:
      operationId: listSaves
      tags: [saves]
      summary: Save slots of the authenticated device's user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Slots of the caller (only the owner's own slots)
          content:
            application/json:
              schema:
                type: object
                required: [saves]
                properties:
                  saves:
                    type: array
                    items: { $ref: '#/components/schemas/SaveSlotSummary' }
              examples:
                default:
                  value:
                    saves:
                      - game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                        slot: default
                        current:
                          revision: 3
                          sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                          size: 524288
                          device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                          device_name: Wohnzimmer-PC
                          created_at: '2026-01-01T12:00:00Z'
                          reason: checkpoint
                        open_conflict_count: 0
                empty:
                  value: { saves: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/games/{game_id}/saves/{slot}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    get:
      operationId: getSaveSlot
      tags: [saves]
      summary: Current checkpoint metadata and open conflicts of a slot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
                with_conflict: { $ref: '#/components/examples/SaveSlotConflictExample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putSave
      tags: [saves]
      summary: Upload the save file (raw body) against a base revision
      description: |
        Raw `application/octet-stream` body (max 64 MiB, opaque, never interpreted by the server).
        Rules, evaluated in order inside one transaction per slot:
        1. SHA-256 equals the current checkpoint -> 200 with the current slot, no new revision (idempotent retry).
        2. `X-Uzume-Base-Revision` equals the current revision (0 and no slot yet) -> new revision, 200.
        3. Otherwise -> 409 `save_conflict`: the upload is secured as history version (`conflict_upload`),
           an open conflict is created or updated (at most one open conflict per slot and device) and
           returned in `conflict`. The current checkpoint stays unchanged.
        A hash mismatch returns 400 `bad_request`; oversize bodies 413 `payload_too_large`.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Uzume-Base-Revision
          in: header
          required: true
          description: Checkpoint revision the upload is based on; 0 = the app had no server save.
          schema: { type: integer, minimum: 0 }
          example: 3
        - name: X-Uzume-Content-SHA256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the body; verified by the server.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          example: '2222222222222222222222222222222222222222222222222222222222222222'
        - name: X-Uzume-Sync-Reason
          in: header
          required: true
          schema: { $ref: '#/components/schemas/SaveSyncReason' }
          example: checkpoint
        - name: X-Uzume-Cheats-Used
          in: header
          required: false
          description: '`run_rules_v1`. `true` when cheats or memory writes were active while this save was made; stored on the new checkpoint and copied to the history versions made from it (`cheats_used`). Absent = false.'
          schema: { type: boolean }
          example: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Accepted (new revision) or identical to the current checkpoint (unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                accepted: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale base revision; the upload was secured and a conflict recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveConflictError' }
              examples:
                default:
                  value:
                    error: { code: save_conflict, message: Base revision is stale; upload secured as conflict }
                    conflict:
                      id: c_placeholder_1
                      game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                      slot: default
                      status: open
                      hub:
                        revision: 3
                        sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                        device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        device_name: Wohnzimmer-PC
                        created_at: '2026-01-01T12:00:00Z'
                      secured:
                        version: 4
                        sha256: '2222222222222222222222222222222222222222222222222222222222222222'
                        base_revision: 2
                        device_id: 5d0f4e2a-1b3c-4d5e-8f60-718293a4b5c6
                        device_name: Laptop
                        created_at: '2026-01-01T13:00:00Z'
                      created_at: '2026-01-01T13:00:00Z'
                      resolved_at: null
                      resolved_by: null
        '413':
          description: Body exceeds 64 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: payload_too_large, message: Save exceeds 64 MiB } } }
    delete:
      operationId: deleteSaveSlot
      tags: [saves]
      summary: Delete a slot with its whole history (`saves_v5`, main slot since `saves_v6`)
      description: |
        Hard delete: checkpoint, history, conflict records and content files of the slot are removed for good; there
        is no undo. The request must confirm the checkpoint revision the caller saw in the required query parameter
        `confirm_revision`; any other value returns 409 `save_conflict_stale` and nothing is deleted, so a stale
        client cannot delete newer progress. A missing or non-numeric `confirm_revision` returns 400 `bad_request`.
        The main slot `default` can be deleted since `saves_v6` (before, 409 `save_slot_protected`). Other errors: 404 for an unknown slot; 409 `session_running`
        while an active Session of the calling user runs the game; 409 `conflict` while the slot has an open
        conflict (resolve it first). Other devices of the user get `save_updated` with reason `deleted` (slot,
        revision and sha256 are those of the deleted checkpoint). The deletion is logged by the server.
      security:
        - bearerAuth: []
      parameters:
        - name: confirm_revision
          in: query
          required: true
          description: Current checkpoint revision the caller saw.
          schema: { type: integer, minimum: 1 }
          example: 3
      responses:
        '204': { description: Slot deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale `confirm_revision`, running Session or open conflict (before `saves_v6` also the default slot); nothing deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                stale: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
                session_running: { value: { error: { code: session_running, message: A Session of this game is running; end it first } } }
  /api/v1/games/{game_id}/saves/{slot}/rename:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    post:
      operationId: renameSaveSlot
      tags: [saves]
      summary: Rename a slot (`saves_v5`)
      description: |
        The slot keeps its checkpoint, full history and conflicts; only the name changes. The new name must match the
        slot name pattern and must not be a Windows reserved device name (`con`, `prn`, `aux`, `nul`, `com1`-`com9`,
        `lpt1`-`lpt9`) or the current name: 400 `bad_request`. 404 for an unknown slot; 409 `save_slot_exists` if the
        new name is taken; 409 `save_slot_protected` for the `default` slot (it cannot be renamed; deleting it is allowed since `saves_v6`);
        409 `session_running` while an active Session of the calling user runs the game. Other devices of the user
        get `save_updated` with reason `renamed`, `slot` = the new name and `previous_slot` = the old name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSlotRenameRequest' }
            examples:
              default: { value: { name: speedrun } }
      responses:
        '200':
          description: Renamed; the slot under its new name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Name taken, default slot or running Session; nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                exists: { value: { error: { code: save_slot_exists, message: A slot with this name already exists } } }
                protected: { value: { error: { code: save_slot_protected, message: The default slot cannot be renamed } } }
                session_running: { value: { error: { code: session_running, message: A Session of this game is running; end it first } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/games/{game_id}/saves/{slot}/content:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    get:
      operationId: downloadSaveContent
      tags: [saves]
      summary: Bytes of the current checkpoint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current checkpoint content
          headers:
            ETag: { schema: { type: string }, description: Strong ETag = content SHA-256, example: '"1111111111111111111111111111111111111111111111111111111111111111"' }
            X-Uzume-Save-Revision: { schema: { type: integer, minimum: 1 }, description: Checkpoint revision of the content, example: 3 }
            Content-Length: { schema: { type: integer, format: int64 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/saves/{slot}/history:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    get:
      operationId: listSaveHistory
      tags: [saves]
      summary: Permanent history versions of a slot (newest first)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/SaveHistoryVersion' }
              examples:
                default:
                  value:
                    versions:
                      - version: 2
                        revision: 3
                        sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                        size: 524288
                        device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        device_name: Wohnzimmer-PC
                        created_at: '2026-01-01T12:00:00Z'
                        reason: session_end
                      - version: 1
                        revision: 1
                        sha256: '3333333333333333333333333333333333333333333333333333333333333333'
                        size: 524288
                        device_id: 5d0f4e2a-1b3c-4d5e-8f60-718293a4b5c6
                        device_name: Laptop
                        created_at: '2025-12-31T20:00:00Z'
                        reason: device_change
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/saves/{slot}/history/{version}/content:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: version
        in: path
        required: true
        description: History version number (vN)
        schema: { type: integer, minimum: 1 }
        example: 1
    get:
      operationId: downloadSaveHistoryContent
      tags: [saves]
      summary: Bytes of a history version
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History version content
          headers:
            ETag: { schema: { type: string }, description: Strong ETag = content SHA-256 }
            X-Uzume-Save-Revision: { schema: { type: integer, minimum: 1 }, description: Checkpoint revision captured by this version, example: 1 }
            Content-Length: { schema: { type: integer, format: int64 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/saves/{slot}/history/{version}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        example: 2
    delete:
      operationId: deleteSaveVersion
      tags: [saves]
      summary: Delete a version from the history (`saves_v3`, any version since `saves_v6`)
      description: |
        Any history version can be deleted (`saves_v6`); before `saves_v6` only versions with reason
        `manual_snapshot` could be deleted and others returned 409 `save_not_snapshot` (no longer returned). The
        secured version of an open conflict of the slot cannot be deleted: 409 `conflict` (resolve the conflict
        first). The version number is never reused. The current checkpoint and all other versions are not touched,
        and no `save_updated` is sent. The content file is removed only when no checkpoint, version or conflict
        still uses it. The deletion is logged by the server.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Version deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version is the secured version of an open conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: conflict, message: Resolve the open conflict first } } }
  /api/v1/games/{game_id}/saves/{slot}/history/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        example: 2
    post:
      operationId: restoreSaveHistoryVersion
      tags: [saves]
      summary: Restore a history version as the new checkpoint (`saves_v2`)
      description: |
        `expected_revision` must equal the current checkpoint revision, otherwise 409 `save_conflict_stale`
        (nothing changed, the caller re-reads the slot). The current checkpoint is first secured into history
        (`before_restore`, unless already captured); then the version's content becomes the new checkpoint
        (revision + 1, reason `restore`, device = caller). Other devices get `save_updated`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRestoreRequest' }
            examples:
              default: { value: { expected_revision: 3 } }
      responses:
        '200':
          description: Restored; the slot after the restore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: expected_revision is stale; nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/games/{game_id}/saves/{slot}/upload:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    post:
      operationId: uploadSaveFile
      tags: [saves]
      summary: Upload a save file (e.g. from another emulator) into a slot (`saves_v4`)
      description: |
        Raw `application/octet-stream` body (max 64 MiB, opaque, never interpreted by the server). Unlike `putSave`
        this is a deliberate replacement and never creates a conflict: `X-Uzume-Expected-Revision` must equal the
        current checkpoint revision (0 = the slot must not exist yet), otherwise 409 `save_conflict_stale` and nothing
        changes. An existing checkpoint is first secured into history (`before_upload`, unless already captured);
        then the body becomes the new checkpoint (revision + 1, reason `upload`, device = caller). A missing slot is
        created at revision 1. A body identical to the current checkpoint changes nothing (200, idempotent).
        Other devices get `save_updated` with reason `upload`.
        An invalid slot name, an empty body, a hash mismatch or a bad header returns 400 `bad_request`; an unknown
        game 404; oversize bodies 413 `payload_too_large`. While an active Session of the calling user runs the
        game (`saves_v5`) the upload is refused with 409 `session_running` and nothing changes.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Uzume-Expected-Revision
          in: header
          required: true
          description: Current checkpoint revision the caller saw; 0 = the slot must not exist yet.
          schema: { type: integer, minimum: 0 }
          example: 3
        - name: X-Uzume-Content-SHA256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the body; verified by the server.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          example: '2222222222222222222222222222222222222222222222222222222222222222'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded (new revision) or identical to the current checkpoint (unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Expected revision does not match (`save_conflict_stale`) or a Session of the game runs (`session_running`); nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
                session_running: { value: { error: { code: session_running, message: A Session of this game is running; end it first } } }
        '413':
          description: Body exceeds 64 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: payload_too_large, message: Save exceeds 64 MiB } } }
  /api/v1/games/{game_id}/saves/{slot}/snapshots:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    post:
      operationId: createSaveSnapshot
      tags: [saves]
      summary: Create a manual snapshot of the current checkpoint (`saves_v2`)
      description: |
        Creates a history version with reason `manual_snapshot` from the current checkpoint, with an optional
        label. 404 when the slot has no checkpoint. Snapshots are never thinned by retention.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSnapshotRequest' }
            examples:
              default: { value: { label: Before final boss } }
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveHistoryVersion' }
              examples:
                default:
                  value:
                    version: 3
                    revision: 3
                    sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                    size: 524288
                    device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    device_name: Wohnzimmer-PC
                    created_at: '2026-01-01T12:30:00Z'
                    reason: manual_snapshot
                    label: Before final boss
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/games/{game_id}/saves/{slot}/conflicts/{conflict_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: conflict_id
        in: path
        required: true
        schema: { type: string }
        example: c_placeholder_1
    post:
      operationId: resolveSaveConflict
      tags: [saves]
      summary: Resolve an open save conflict
      description: |
        `expected_revision` must equal the current checkpoint revision, otherwise 409 `save_conflict_stale`
        (nothing changed, the caller re-reads the slot). Before applying, the current checkpoint is copied
        to history (`before_conflict_resolution`). `use_hub`: conflict -> `resolved_hub`, the secured upload
        stays in history. `use_local`: the secured upload becomes a new checkpoint (revision + 1),
        conflict -> `resolved_local`. Resolving an already resolved conflict returns 409 `save_conflict_stale`.
        "Keep both, decide later" is no call; the conflict simply stays `open`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveResolveRequest' }
            examples:
              use_hub: { value: { resolution: use_hub, expected_revision: 3 } }
              use_local: { value: { resolution: use_local, expected_revision: 3 } }
      responses:
        '200':
          description: Resolved; the slot after the resolution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: expected_revision is stale or the conflict is already resolved; nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [sessions]
      summary: Users of this server (for the invite field)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users with online state (at least one device connected via WSS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
              examples:
                default:
                  value:
                    users:
                      - { id: u_placeholder_1, display_name: Fabio, online: true }
                      - { id: u_placeholder_2, display_name: Anna, online: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: Active Sessions the caller may join or owns, plus Sessions inviting the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
              examples:
                default:
                  value:
                    sessions:
                      - session_id: 4e8d2a60-7b1c-4f3e-8a5d-6c7b8a9d0e1f
                        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                        game_title: Demo Homebrew
                        owner: { user_id: u_placeholder_1, display_name: Fabio, device_name: Wohnzimmer-PC }
                        visibility: hub_users
                        created_at: '2026-01-01T12:00:00Z'
                        viewer_count: 0
                        is_owner: false
                        invited: false
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: publishSession
      tags: [sessions]
      summary: Publish a Session (ends the device's previous Session)
      description: |
        A device has at most one active Session; publishing a new one ends the previous one (`session_ended`
        reason `replaced`). A device whose handshake reported `video.h264_encode=false` gets 409 `capability_missing`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPublishRequest' }
            examples:
              default: { value: { game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d, visibility: hub_users } }
      responses:
        '201':
          description: Session published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                default: { $ref: '#/components/examples/SessionExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CapabilityMissing' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      tags: [sessions]
      summary: One Session (caller must be allowed to see it)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Session; `viewers` and `invites` only for the owner device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                default: { $ref: '#/components/examples/SessionExample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Change the visibility (owner device); revokes viewers that are no longer allowed
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionUpdateRequest' }
            examples:
              default: { value: { visibility: invite_only } }
      responses:
        '200':
          description: The updated Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                default: { $ref: '#/components/examples/SessionExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
        '413': { $ref: '#/components/responses/TooLarge' }
    delete:
      operationId: endSession
      tags: [sessions]
      summary: End the Session (owner device)
      security:
        - bearerAuth: []
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/sessions/{session_id}/invites/{user_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: inviteSessionUser
      tags: [sessions]
      summary: Invite a user of this server (owner device); a declined invite becomes open again
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Session with the invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                default: { $ref: '#/components/examples/SessionExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
    delete:
      operationId: withdrawSessionInvite
      tags: [sessions]
      summary: Withdraw an invite (owner device); removes that user's viewers
      security:
        - bearerAuth: []
      responses:
        '204': { description: Invite withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/sessions/{session_id}/decline:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: declineSession
      tags: [sessions]
      summary: Decline the invite (invited user); the owner is notified via session_update
      security:
        - bearerAuth: []
      responses:
        '204': { description: Invite declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/sessions/{session_id}/join:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: joinSession
      tags: [sessions]
      summary: Join as viewer (ACL checked here)
      description: |
        Max 4 viewers (409 `session_full`). A device whose handshake reported `video.h264_decode=false` gets
        409 `capability_missing`. Joining again with the same device returns the existing viewer.
        Signaling continues over WSS (`signal`).
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Viewer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionJoinResponse' }
              examples:
                default:
                  value:
                    viewer_id: 5d1f7c2e-3b4a-4c6d-9e8f-1a2b3c4d5e6f
                    permissions: { view_video: true, hear_audio: true, send_input: false }
                    ice_servers: ['stun:stun.example.org:3478']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '409': { $ref: '#/components/responses/SessionFullOrCapability' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/sessions/{session_id}/viewers/{viewer_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: viewer_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 5d1f7c2e-3b4a-4c6d-9e8f-1a2b3c4d5e6f
    delete:
      operationId: removeSessionViewer
      tags: [sessions]
      summary: Remove a viewer (owner device) or leave (the viewer's own device)
      security:
        - bearerAuth: []
      responses:
        '204': { description: Viewer removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Runs the caller participates in (any participant status, not archived), most recently changed first
      description: |
        Feature `runs_v1`. Every run includes the per-plugin states of every participant (the same object as `GET /runs/{run_id}`)
        when the caller has joined; for invited, declined and left callers `states` of every participant is empty.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a run (the caller joins with `game_id`, status `starting`)
      description: |
        Every plugin version must be offered by this server (400 otherwise). `invite_user_ids` are users of this server;
        the creator plus the invited users are at most 8. `settings` is an opaque JSON object of at most 16 KiB
        (413 `too_large`). Invited users receive `run_updated`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCreateRequest' }
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags: [runs]
      summary: One run with every participant's per-plugin states (participants of any status only; others get 404)
      description: |
        Callers who are participants but have not joined (invited, declined, left) see the title, the game and the
        participant list only: `states` of every participant is `{}`. Events and states are for joined participants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/join:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: joinRun
      tags: [runs]
      summary: Join with a library game (from invited, declined or left); the same game again is a no-op
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunJoinRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/variant:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunVariant
      tags: [runs]
      summary: The recipe the caller builds their variant of a randomizer run from (`variants_v1`)
      description: |
        Only for joined participants (404 for others, 403 for invited, declined or left callers). 409 when the run has no
        randomizer. `seed` is the run seed for mode `same` and a seed derived from the run seed and the caller's user id for mode
        `each`: the first 8 bytes of SHA-256(decimal(run_seed) + ":" + user_id), read big-endian, top bit cleared. The run seed
        itself is never delivered. A participant who joined with an own variant (`variant_kind` `own`) gets the recipe of that variant.
        `slot` is the run's save slot.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The recipe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunVariant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/variant-state:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: setRunVariantState
      tags: [runs]
      summary: Report how far the caller's variant of a randomizer run is (`variants_v1`)
      description: Only for the caller themself (a joined participant). Pushes `run_updated`. 409 when the run has no randomizer or is over.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunVariantStateRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/invite:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: inviteRun
      tags: [runs]
      summary: Invite more users (any joined participant, while the run is starting, active or paused)
      description: |
        Users who are already invited or joined are skipped; users who declined or left are invited again. Unknown
        or disabled users are a 400. More than 8 participants in total are a 409. Appends the server event `run.invited`
        and sends `run_updated`. If nobody is newly invited the run is returned unchanged and nothing is appended.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInviteRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/decline:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: declineRun
      tags: [runs]
      summary: Decline the invite (only from invited; declining again is a no-op)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/leave:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: leaveRun
      tags: [runs]
      summary: Leave a run the caller joined (leaving again is a no-op); colour and state stay
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/status:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: setRunStatus
      tags: [runs]
      summary: Change the run status
      description: |
        `active`: from `starting` by the creator, from `paused` by any joined participant. `paused`: from `active`,
        any joined participant. `finished` or `abandoned`: the creator, from any run that is not over. Other
        transitions are 409 `conflict`; the right transition by the wrong user is 403. The server appends a `run.status` event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStatusRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/rules:
    parameters:
      - $ref: '#/components/parameters/RunId'
    put:
      operationId: setRunRules
      tags: [runs]
      summary: Replace the core rules of a run (`run_rules_v1`)
      description: |
        Takes the whole `RunRules` object. Only the creator of the run or a server admin; another participant gets 403
        `forbidden`, somebody who is not part of the run 404. Allowed in every status except finished and abandoned (409
        `conflict`). Unchanged rules write nothing. A change appends the run event `rules.changed` (`payload`:
        `{before, after, by_user_id, by_user_name}`) and pushes `run_updated` and `run_event` to the joined participants.
        When a rule switches to `off` the apps drop the matching active cheats or stop memory writes at once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRules' }
      responses:
        '200':
          description: The run with the new rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/state/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putRunState
      tags: [runs]
      summary: Replace the caller's own state of one plugin (JSON object, at most 64 KiB) against a base revision
      description: |
        Each participant has one state object per plugin of the run, each with its own revision. `plugin_id` must be a
        plugin of the run (404 `not_found`). `base_rev` must equal the current `state_rev` of that plugin (0 when none
        was written yet), otherwise 409 `state_conflict` with the current `state_rev` and `state`. Joined participants
        only (403 otherwise). Starting and active runs only (409 `run_not_active`). Rate limit 4/s, burst 20 per
        participant (all plugins together; 429 `rate_limited`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStateRequest' }
      responses:
        '200':
          description: State stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`state_conflict` (carries the current state) or `run_not_active`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStateConflictError' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: appendRunEvent
      tags: [runs]
      summary: Append an event to the log (joined participants)
      description: |
        `client_id` makes the call idempotent: the same `client_id` again returns 200 with the original `seq`.
        `plugin_id` must be a plugin of the run. Starting and active runs only (409 `run_not_active`); at most
        50 000 events per run (409 `conflict`). Rate limit 2/s, burst 30 per participant (429 `rate_limited`).
        Payload at most 4 KiB (413 `too_large`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunEventRequest' }
      responses:
        '200':
          description: The event already existed (same `client_id`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventResult' }
        '201':
          description: Event appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: Events with seq greater than `after`, in order (joined participants)
      description: |
        Only joined participants read the event log. Invited, declined and left participants get 403 `forbidden`;
        everybody else 404.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Events and the run's current `last_seq`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/boards/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunPluginId'
    put:
      operationId: putRunBoard
      tags: [runs]
      summary: Publish the plugin's board (building-block tree, at most 64 KiB) for the server web run page
      description: |
        Joined participants only (403 otherwise); the plugin must be a plugin of the run (404). Starting and active runs
        only (409 `run_not_active`). Rate limit 1/s, burst 5 per participant (429 `rate_limited`). The server checks the
        shape (a JSON object) and the size, not the building blocks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunBoardRequest' }
      responses:
        '200':
          description: Board stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunBoardResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Server health (admin only)
      description: |
        Server health: identity, uptime, open problems (most urgent first),
        CPU, memory, the disk of the data directory, running Sessions, the built-in TURN relay, connected apps and
        the warnings and errors of the last 24 hours (secrets removed). Needs the access token of a device of an
        admin user, otherwise 403.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/status/log:
    get:
      operationId: getAdminStatusLog
      tags: [admin]
      summary: Download the recent server log (admin only)
      description: The last log lines the server keeps in memory as plain text, redacted like the diagnostics bundle.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Log text
          headers:
            Content-Disposition: { schema: { type: string }, example: 'attachment; filename="uzume-server-log-20261022-081500.txt"' }
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/storage:
    get:
      operationId: getAdminStorage
      tags: [admin]
      summary: Storage overview (admin only)
      description: |
        What the data directory holds, measured on request (a directory walk, no database lock is held meanwhile):
        the disk of the data directory, the backup disk, the size and file count per kind, the screenshot usage per
        user and game (largest first, at most 20) and the clean-up suggestions with what each would free. Needs the
        access token of a device of an admin user, otherwise 403.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The storage overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStorage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/storage/cleanup:
    post:
      operationId: cleanupAdminStorage
      tags: [admin]
      summary: Run one storage clean-up (admin only)
      description: |
        Runs one clean-up of `getAdminStorage` and returns what it freed. Clean-up never offers or removes saves
        (current checkpoints, manual snapshots and anything of an open conflict are kept). Definitions:
        `old_snapshots` removes history versions of saves that are more than 90 days old, except manual snapshots
        (reason `manual_snapshot`, made by users or plugins), versions of a slot with an open conflict and current
        checkpoints; a content file goes only when no checkpoint and no other version uses it, and version numbers are
        never reused. `upload_leftovers` removes resumable upload sessions in `tmp/uploads` that were idle for more
        than 7 days with their data. `unused_cores` removes core package versions that no system uses (no installed
        core of any system is on that version, so neither the default nor any selected core is touched); the server
        records no core per Session. Needs "Confirm it's you" (403 `confirmation_required` until then). 400 `bad_request` for an unknown id.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminStorageCleanupRequest' }
      responses:
        '200':
          description: What the clean-up freed (zero when there was nothing to clean)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStorageCleanupResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not an admin (`forbidden`) or the caller must confirm first (`confirmation_required`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: confirmation_required, message: Confirm it's you first } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: State of the Prometheus metrics endpoint (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: setAdminMetrics
      tags: [admin]
      summary: Switch the Prometheus metrics endpoint on or off (admin only)
      description: |
        Off by default; while off `GET /metrics` answers 404. Switching it on for the first time creates a token and
        returns it once in `token`; later calls never return it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMetricsUpdate' }
            examples:
              default: { value: { enabled: true } }
      responses:
        '200':
          description: The setting now stored
