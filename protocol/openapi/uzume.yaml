            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '400':
          description: Invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/metrics/token:
    post:
      operationId: createAdminMetricsToken
      tags: [admin]
      summary: Create a new metrics token (admin only)
      description: Replaces the token; the previous one stops working at once. The new token is returned once, the server keeps only a hash.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetricsToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Send a problem report to the server (`reports_v1`)
      description: |
        Any paired device of any user. `multipart/form-data` with a `meta` part (JSON, `ReportMeta`) and up to 12 file
        parts named `files` (the file name of each part is the attachment name; `[A-Za-z0-9._-]`, at most 80 characters).
        The whole report is limited to 25 MiB (413 `payload_too_large`); a device may send 5 reports per hour (429
        `rate_limited`). The server removes secrets from the description and from text attachments again. Admins see the
        report under Reports; it is kept until an admin deletes it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta]
              properties:
                meta: { $ref: '#/components/schemas/ReportMeta' }
                files: { type: array, items: { type: string, format: binary } }
            encoding:
              meta: { contentType: application/json }
              files: { contentType: application/octet-stream }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/reports:
    get:
      operationId: listAdminReports
