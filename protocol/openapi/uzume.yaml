                          - { core_id: desmume, display_name: 'Nintendo DS (DeSmuME)', version: 2026.10.09, license: GPLv2, experimental: true, required_hw_api: null, origin: libretro-buildbot, build_date: '2026-10-09' }
                        firmware_mode: builtin
