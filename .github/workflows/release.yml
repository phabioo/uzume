name: Release

# Manual (beta on demand, ADR 0016 amendment 2026-10-28): publishes the artifacts of ONE successful CI run on main
# (default: the newest build that is not released yet) as a GitHub prerelease vX.Y.Z (beta; the tag was reserved by the
# CI version job), adds them to the signed updates index (release "updates-index") and prunes old prereleases.
# Every main build has its number and artifacts; only the builds picked here become betas. No rebuild: the files are
# exactly what CI built and tested (CI artifacts are kept 7 days). ADR 0011.
# The stable release is made by promote.yml from such a prerelease (same files, same number). To make that possible
# the index descriptions are also uploaded to the prerelease (index-hub.json, index-player.json).
# The signing seed is the signing-key secret of the environment `release` (deployment branch: main only); it is only in the environment of the signing step.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build to publish: 21.7, v21.7.0 or 21.7.0 (empty = newest green main build that is not published yet)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Nothing is cancelled and no run is dropped (CI-6): a concurrency group keeps only ONE pending run, so with several
# publishes started during one the middle one would be cancelled and never get its prerelease and index entry.
# Every run has its own group; the index update (read-modify-write) is serialised by the queue in
# scripts/wait-index-turn.sh instead, oldest run first, shared with promote.yml.
concurrency:
  group: updates-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release and update the index
    # The environment `release` is main-only; failing early in the first step gives a clearer message than a refused deployment.
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # includes waiting for older index updates (wait-index-turn.sh, at most 40 minutes)
    environment: release
    permissions:
      contents: write   # create/delete releases, upload assets
      actions: read     # download the artifacts of the CI run
      packages: write   # push the server image to ghcr.io (ADR 0029 D1)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_INPUT: ${{ inputs.build }}
    steps:
      - name: Find the CI build
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run this workflow from main (selected: $GITHUB_REF); the signing environment is main-only"; exit 1; }
          # Successful CI runs of pushes to main, newest first (the CI version job reserved one plain tag vR.B.0 per run).
          gh run list --workflow ci.yml --branch main --event push --status success --limit 50 \
            --json databaseId,headSha,createdAt --jq 'sort_by(.createdAt) | reverse' > "$RUNNER_TEMP/ci-runs.json"
          released() { gh release view "$1" >/dev/null 2>&1; }
          tag_sha() { gh api "repos/$GH_REPO/git/ref/tags/$1" --jq '.object | select(.type == "commit") | .sha' 2>/dev/null || true; }
          want="$(echo "$BUILD_INPUT" | tr -d '[:space:]')"
          run_id=""; head_sha=""; tag=""
          if [ -n "$want" ]; then
            want="${want#v}"
            [[ "$want" =~ ^[0-9]+\.[0-9]+(\.0)?$ ]] || { echo "::error::build '$BUILD_INPUT' is not R.B, R.B.0 or vR.B.0"; exit 1; }
            [[ "$want" =~ ^[0-9]+\.[0-9]+\.0$ ]] || want="$want.0"
            tag="v$want"
            head_sha="$(tag_sha "$tag")"
            [ -n "$head_sha" ] || { echo "::error::no tag $tag: this build number was never reserved (or the tag was pruned after 8 days)"; exit 1; }
            run_id="$(jq -r --arg s "$head_sha" '[.[] | select(.headSha == $s)][0].databaseId // empty' "$RUNNER_TEMP/ci-runs.json")"
            [ -n "$run_id" ] || { echo "::error::no successful CI push run on main for $tag (commit $head_sha) among the newest 50: the build failed, is too old, or its artifacts expired (retention 7 days)"; exit 1; }
          else
            while read -r id sha; do
              t="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[] | select(.object.sha == "'"$sha"'") | .ref | sub("^refs/tags/"; "") | select(test("^v[0-9]+\\.[0-9]+\\.0$"))' | sort -V | tail -n 1)"
              [ -n "$t" ] || continue
              if released "$t"; then
                echo "::error::newest green main build $t is already published; nothing newer to release"
                exit 1
              fi
              run_id="$id"; head_sha="$sha"; tag="$t"; break
            done < <(jq -r '.[] | "\(.databaseId) \(.headSha)"' "$RUNNER_TEMP/ci-runs.json")
            [ -n "$run_id" ] || { echo "::error::no green main build with a reserved version tag found among the newest 50 CI runs"; exit 1; }
          fi
          if released "$tag"; then
            echo "::warning::$tag already has a release; the files are published again (--clobber) and the index entry is replaced"
          fi
          # Artifacts of old runs are deleted after 7 days; fail here, before the queue and the build of uzume-sign.
          n="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("uzume-")))] | length')"
          [ "$n" -gt 0 ] || { echo "::error::the artifacts of CI run $run_id ($tag) are expired (retention 7 days); only builds of the last 7 days can be published"; exit 1; }
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          {
            echo "### Publishing build ${tag#v}"
            echo "- Tag: \`$tag\`, commit \`${head_sha:0:12}\`, CI run [$run_id]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id)"
            if [ -n "$BUILD_INPUT" ]; then echo "- Chosen by input \`$BUILD_INPUT\`"; else echo "- Chosen: newest green main build that is not published yet"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The workflow file and scripts come from the default branch; the release files from the CI run (artifacts).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history and tags for the release notes (scripts/changelog.py)
      - name: Wait for older index updates (queue, nothing is dropped)
        timeout-minutes: 45
        run: scripts/wait-index-turn.sh 40
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build uzume-sign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/uzume-sign" ./cmd/uzume-sign)
      - name: Signing key is trusted by the server (before anything is published)
        env:
          UZUME_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: scripts/check-signing-key.sh "$RUNNER_TEMP/bin/uzume-sign"
      - name: Download the artifacts of the CI run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts
          pattern: uzume-*
      - name: Collect release files and decide channel
        run: |
          set -euo pipefail
          art="$RUNNER_TEMP/artifacts"
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          hub_info="$art/uzume-server-linux/hub-release-info.json"
          player_info="$art/uzume-app-windows-x64/player-release-info.json"
          player_info_linux="$art/uzume-app-linux-x64/player-release-info-linux.json"
          for f in "$hub_info" "$player_info" "$player_info_linux"; do [ -f "$f" ] || { echo "::error::missing $f (artifacts of CI run $RUN_ID)"; exit 1; }; done
          version="$(jq -r .version "$hub_info")"
          channel="$(jq -r .channel "$hub_info")"
          commit="$(jq -r .commit "$hub_info")"
          for k in version channel; do
            [ "$(jq -r ".$k" "$player_info")" = "$(jq -r ".$k" "$hub_info")" ] || { echo "::error::server and app disagree on $k"; exit 1; }
            [ "$(jq -r ".$k" "$player_info_linux")" = "$(jq -r ".$k" "$hub_info")" ] || { echo "::error::server and Linux app disagree on $k"; exit 1; }
          done
          [ "$(jq -r .commit "$player_info_linux")" = "$(jq -r .commit "$hub_info")" ] || { echo "::error::server and Linux app disagree on commit"; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected version '$version' (plain R.B.0 expected, ADR 0036)"; exit 1; }
          [ "$channel" = beta ] || { echo "::error::main build with channel '$channel'"; exit 1; }
          [ "$commit" = "$HEAD_SHA" ] || { echo "::error::build commit $commit is not the CI run commit $HEAD_SHA"; exit 1; }
          tag="v$version"
          # The CI version job reserved the tag on this commit.
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object | select(.type == "commit") | .sha' 2>/dev/null || true)"
          [ "$tag_sha" = "$HEAD_SHA" ] || { echo "::error::tag $tag does not exist or does not point at $HEAD_SHA (found '${tag_sha:-none}')"; exit 1; }
          cp "$art"/uzume-server-linux/uzume-server_"${version}"_amd64.deb "$art"/uzume-server-linux/uzume-server_"${version}"_arm64.deb "$rel/"
          cp "$art/uzume-server-linux/uzume-server-linux-amd64" "$rel/uzume-server-$version-linux-amd64"
          cp "$art/uzume-server-linux/uzume-server-linux-arm64" "$rel/uzume-server-$version-linux-arm64"
          cp "$art/uzume-server-windows/uzume-server-windows-amd64.exe" "$rel/uzume-server-$version-windows-amd64.exe"
          cp "$art/uzume-server-linux/LICENSE" "$rel/LICENSE"
          cp "$art/uzume-server-linux/THIRD-PARTY-NOTICES.txt" "$rel/THIRD-PARTY-NOTICES-hub.txt"
          cp "$art/uzume-app-windows-x64/uzume-$version-windows-x64.zip" "$rel/"
          cp "$art/uzume-windows-x64-msi/uzume-$version-windows-x64.msi" "$rel/"
          cp "$art/uzume-app-linux-x64/Uzume-$version-x86_64.AppImage" "$rel/"
          (cd "$rel" && sha256sum -- * > SHA256SUMS)
          cat "$rel/SHA256SUMS"
          {
            echo "VERSION=$version"
            echo "SHOWN=${version%.0}"   # display form R.B (ADR 0036); tags, file names and the index keep R.B.0
            echo "CHANNEL=$channel"
            echo "COMMIT=$commit"
            echo "TAG=$tag"
          } >> "$GITHUB_ENV"
      - name: Collect the release notes
        run: |
          set -euo pipefail
          # Base = the highest plain vX.Y.Z release (prerelease or not) below this version; none: the newest stable release.
          # A failure here (API error, missing history) never blocks the release: fixed text and no `notes` in the index.
          fallback="Beta build of commit $HEAD_SHA from main."
          notes="$RUNNER_TEMP/notes.md"
          : > "$RUNNER_TEMP/notes-hub.txt"; : > "$RUNNER_TEMP/notes-player.txt"
          collect() {
            git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA" || return 1
            local base
            base="$(gh release list --limit 200 --json tagName,isPrerelease \
              --jq '.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tagName' \
              | { grep -vx "$TAG" || true; } | { cat; echo "$TAG"; } | sort -V | { grep -x -B1 "$TAG" || true; } | head -n 1)" || return 1
            if [ -z "$base" ] || [ "$base" = "$TAG" ]; then
              base="$(gh release list --limit 200 --json tagName,isPrerelease \
                --jq '[.[] | select((.isPrerelease | not) and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tagName // empty')" || return 1
            fi
            [ -n "$base" ] || { echo "no base release found" >&2; return 1; }
            git rev-parse --verify -q "refs/tags/$base" >/dev/null || git fetch --no-tags origin "refs/tags/$base:refs/tags/$base" || return 1
            {
              python3 -I scripts/changelog.py collect --repo "$GH_REPO" --base "$base" --head "$HEAD_SHA" --format markdown \
                --title "## Changes since $(v=${base#v}; case $v in 0.*) echo "$v" ;; *) echo "${v%.0}" ;; esac)" --compare-url || return 1
              echo
              echo "Commit: [\`${HEAD_SHA:0:12}\`]($GITHUB_SERVER_URL/$GH_REPO/commit/$HEAD_SHA)"
            } > "$notes.part" || return 1
            python3 -I scripts/changelog.py collect --repo "$GH_REPO" --base "$base" --head "$HEAD_SHA" --format index --product hub > "$RUNNER_TEMP/notes-hub.txt" || return 1
            python3 -I scripts/changelog.py collect --repo "$GH_REPO" --base "$base" --head "$HEAD_SHA" --format index --product player > "$RUNNER_TEMP/notes-player.txt" || return 1
          }
          {
            if collect; then
              cat "$notes.part"
            else
              echo "::warning::could not collect the release notes, using the fixed text" >&2
              : > "$RUNNER_TEMP/notes-hub.txt"; : > "$RUNNER_TEMP/notes-player.txt"
              echo "$fallback"
            fi
            echo
            echo "Not for production use. The stable release is this very build, promoted with the workflow \"Promote to release\" (no rebuild)."
          } > "$notes"
      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/release"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Uzume $SHOWN (beta)" --prerelease --latest=false \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$rel"/* --clobber
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the server image (multi-arch, from the CI binaries, no rebuild)
        run: |
          set -euo pipefail
          # The image only copies the linux binaries that CI built and tested (target hub-prebuilt), so it carries exactly
          # the version of the .deb files. :X.Y.Z and :beta; promote.yml adds :stable and :latest to the same manifest.
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx build --push --provenance=false --sbom=false \
            --platform linux/amd64,linux/arm64 \
            -f packaging/docker/Dockerfile --target hub-prebuilt \
            --build-context prebuilt-bin="$RUNNER_TEMP/artifacts/uzume-server-linux" \
            --build-arg HUB_VERSION="$VERSION" --build-arg HUB_COMMIT="$COMMIT" \
            -t "$owner/uzume-server:$VERSION" -t "$owner/uzume-server:beta" .
          docker buildx imagetools inspect "$owner/uzume-server:$VERSION"
      - name: Prune leftover test prereleases (betas are all kept)
        run: |
          set -euo pipefail
          # Beta prereleases v<X.Y.Z> and the legacy v<X.Y.Z>-beta.<N> are never deleted (the release notes stay traceable).
          # Only the retired v<X.Y.Z>-test.<N> prereleases are removed; non-prerelease releases and other tags are never touched.
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-test\\.[0-9]+$")) | .tagName' \
            | while read -r old; do
                [ -n "$old" ] || continue
                echo "deleting $old"
                gh release delete "$old" --cleanup-tag --yes
              done
      - name: Prune orphan version tags (reserved by CI, never released)
        run: |
          set -euo pipefail
          # The CI version job reserves vX.Y.Z before building (ADR 0016 D2). Since betas are published on demand, most
          # tags never get a release (skipped or failed builds). Such a tag can never be released once the CI artifacts
          # are gone (retention 7 days), so plain tags without a release whose commit is older than 8 days are deleted. Only the newest 60 plain tags
          # are looked at; tags with a release, other tag shapes and this run's tag are never touched.
          cutoff="$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" \
            --jq '.[] | select(.ref | test("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .ref | sub("^refs/tags/"; "")' \
            | sort -V | tail -n 60 | while read -r t; do
                [ "$t" != "$TAG" ] || continue
                if gh release view "$t" >/dev/null 2>&1; then continue; fi
                sha="$(gh api "repos/$GH_REPO/git/ref/tags/$t" --jq '.object | select(.type == "commit") | .sha' 2>/dev/null || true)"
                [ -n "$sha" ] || continue
                date="$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date 2>/dev/null || true)"
                if [ -z "$date" ] || [[ ! "$date" < "$cutoff" ]]; then continue; fi
                echo "deleting orphan tag $t (no release, commit from $date)"
                gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" >/dev/null || echo "::warning::could not delete tag $t"
              done
      - name: Build release descriptions for the index
        run: |
          set -euo pipefail
          rel="$RUNNER_TEMP/release"
          art="$RUNNER_TEMP/artifacts"
          out="$RUNNER_TEMP/index-in"
          mkdir -p "$out"
          # Asset URLs and sizes as GitHub reports them (GitHub may normalise asset names): look up every wanted asset.
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets | map({name, size, url: .browser_download_url})' > "$RUNNER_TEMP/assets.json"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          artifact() { # platform kind name
            local name="$3" a
            [ -f "$rel/$name" ] || { echo "::error::$name missing locally" >&2; exit 1; }
            a="$(jq -c --arg n "$name" '.[] | select(.name == $n)' "$RUNNER_TEMP/assets.json")"
            [ -n "$a" ] || { echo "::error::asset $name is not on release $TAG (GitHub renamed it?)" >&2; exit 1; }
            [ "$(jq -r .size <<<"$a")" = "$(stat -c %s "$rel/$name")" ] || { echo "::error::size of $name differs on GitHub" >&2; exit 1; }
            jq -nc --arg platform "$1" --arg kind "$2" --arg name "$name" --argjson a "$a" \
              --arg sha "$(sha256sum "$rel/$name" | cut -d' ' -f1)" \
              '{platform:$platform, kind:$kind, name:$name, size:$a.size, sha256:$sha, url:$a.url}'
          }
          mk() { # product info-file artifacts-json notes-file (short release notes for the index; the field is left out when empty; schema_version / msi_downgrade pass through from the info file only when set, for update rollback)
            jq --arg now "$now" --arg notes "https://github.com/$GH_REPO/releases/tag/$TAG" --argjson artifacts "$3" --rawfile text "$4" \
              '{product, channel, version, commit, published_at:$now, notes_url:$notes, protocol_version, min_protocol_version, artifacts:$artifacts}
               + ({schema_version, msi_downgrade} | with_entries(select(.value != null and .value != false and .value != 0)))
               | if .product == "hub" or .product == "player" then . else error("bad product") end
               | if ($text | length) > 0 then . + {notes: $text} else . end' "$2"
          }
          # Plain assignments (not process substitution) so a missing asset aborts the step.
          h1="$(artifact linux-amd64 deb "uzume-server_${VERSION}_amd64.deb")"
          h2="$(artifact linux-arm64 deb "uzume-server_${VERSION}_arm64.deb")"
          h3="$(artifact linux-amd64 binary "uzume-server-$VERSION-linux-amd64")"
          h4="$(artifact linux-arm64 binary "uzume-server-$VERSION-linux-arm64")"
          h5="$(artifact windows-amd64 binary "uzume-server-$VERSION-windows-amd64.exe")"
          # One MSI for both products: the Hub entry points to the same file (name, size, hash) as the Player entry.
          h6="$(artifact windows-amd64 msi "uzume-$VERSION-windows-x64.msi")"
          p0="$(artifact windows-x64 msi "uzume-$VERSION-windows-x64.msi")"
          p1="$(artifact windows-x64 zip "uzume-$VERSION-windows-x64.zip")"
          p2="$(artifact linux-x64 appimage "Uzume-$VERSION-x86_64.AppImage")"
          hub_arts="$(jq -sc '.' <<<"$h1 $h2 $h3 $h4 $h5 $h6")"
          player_arts="$(jq -sc '.' <<<"$p0 $p1 $p2")"
          mk hub "$art/uzume-server-linux/hub-release-info.json" "$hub_arts" "$RUNNER_TEMP/notes-hub.txt" > "$out/hub.json"
          mk player "$art/uzume-app-windows-x64/player-release-info.json" "$player_arts" "$RUNNER_TEMP/notes-player.txt" > "$out/player.json"
          jq -c '{product, channel, version, artifacts: (.artifacts | length)}' "$out/hub.json" "$out/player.json"
          # Kept on the prerelease so that promote.yml can promote it later, even after the beta entry left the index.
          cp "$out/hub.json" "$out/index-hub.json"
          cp "$out/player.json" "$out/index-player.json"
          gh release upload "$TAG" "$out/index-hub.json" "$out/index-player.json" --clobber
      - name: Update the signed index
        env:
          # The seed exists only in the environment of this step; it is never echoed or written to disk.
          UZUME_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: scripts/update-index.sh "$RUNNER_TEMP/bin/uzume-sign" "$RUNNER_TEMP/index-in/hub.json" "$RUNNER_TEMP/index-in/player.json"
