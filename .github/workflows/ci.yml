name: CI

on:
  push:
    branches: [main]   # other branches: ci-branch.yml (calls this workflow unless the branch has an open PR)
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  # main: one group per commit, so no run is cancelled or replaced by a newer pending run (GitHub keeps only one pending
  # run per group; a shared group would drop the middle commit of two quick merges). The tag reservation in the version
  # job copes with parallel main runs. Everything else: one group per ref, a newer push cancels the older run.
  # When called from ci-branch.yml, github.workflow is "CI (branch)" and the group differs from the caller's own.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Build version and channel, computed once (ADR 0011). A push to main gets a plain, auto-incremented beta version X.Y.Z
  # (VERSION is the floor, scripts/next-beta-version.sh) and reserves it by creating the lightweight tag vX.Y.Z on the
  # commit; release.yml publishes the prerelease for that tag and promote.yml turns it into the stable release without
  # a rebuild. Everything else (PRs, branches, manual runs) is VERSION-dev.<run>, channel dev, and publishes nothing.
  version:
    name: Version and channel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # reserve the version tag (push to main only)
    outputs:
      core: ${{ steps.v.outputs.core }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the token is passed explicitly (env) to the tag step only
      - name: Compute version and channel
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          floor="$(tr -d '[:space:]' < VERSION)"
          [[ "$floor" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z, found '$floor'"; exit 1; }
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            channel="beta"
            # No persisted credentials: authenticate git (ls-remote) for this step through env-based config.
            basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$basic"
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0
            for attempt in 1 2 3 4 5; do
              core="$(git ls-remote --tags origin 'refs/tags/v*' | scripts/next-beta-version.sh "$floor" "$SHA")"
              # Tag already on this commit (re-run) or reserved now; a lost race ("Reference already exists") recomputes.
              if [ "$(git ls-remote origin "refs/tags/v$core" | cut -f1)" = "$SHA" ]; then break; fi
              if gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/v$core" -f "sha=$SHA" >/dev/null 2>err.txt; then break; fi
              echo "attempt $attempt: could not reserve v$core: $(head -c 300 err.txt)"
              core=""
              sleep $((attempt * 2))
            done
            [ -n "$core" ] || { echo "::error title=Version tag::could not reserve a beta version tag after 5 attempts"; exit 1; }
            version="$core"
          else
            core="$floor"; version="$floor-dev.$RUN_NUMBER"; channel="dev"
          fi
          {
            echo "core=$core"
            echo "version=$version"
            echo "channel=$channel"
            echo "commit=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, channel $channel" >> "$GITHUB_STEP_SUMMARY"

  # Docs-only gate: true only for PRs and non-main branch pushes whose diff touches nothing but docs/** and *.md.
  # Pushes classify the whole branch vs main (origin/main...sha), not just the last push, so a docs-only push that
  # cancels an earlier code run (concurrency) still runs the builds. PRs use base...head.
  # Always false for main (beta release, Windows cache priming per ADR 0008) and workflow_dispatch on main; a
  # workflow_dispatch on another ref is classified like a branch push (used for the changelog PR, see promote.yml).
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.d.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: d
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          reason=""
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" != refs/heads/main ]; then
            # Whole branch since the merge base with main (covers new branches and cancelled earlier runs).
            git rev-parse --verify -q refs/remotes/origin/main >/dev/null || git fetch --no-tags origin main || true
            if git rev-parse --verify -q refs/remotes/origin/main >/dev/null && git merge-base origin/main "$SHA" >/dev/null 2>&1; then
              range="origin/main...$SHA"
            else
              reason="origin/main or merge base not available"
            fi
          else
            reason="event $EVENT on $REF always runs the full pipeline"
          fi
          files=()
          if [ -n "$range" ]; then
            while IFS= read -r -d '' f; do files+=("$f"); done < <(git diff --name-only --no-renames -z "$range")
            if [ "${#files[@]}" -eq 0 ]; then
              reason="empty diff"
            else
              docs_only=true
              for f in "${files[@]}"; do
                case "$f" in
                  docs/* | *.md) ;;
                  *) docs_only=false; reason="non-docs path: $f"; break ;;
                esac
              done
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "### Docs-only detection"
            echo "docs_only=$docs_only ${reason:+($reason)}"
            if [ "${#files[@]}" -gt 0 ]; then
              echo "Changed files (\`$range\`):"
              printf -- '- %s\n' "${files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check documentation links
        run: python3 -I scripts/check-doc-links.py

  hub:
    name: Hub (Go, Linux)
    # Skipped for docs-only changes (see job changes); a skipped job counts as passing for required checks.
    if: needs.changes.outputs.docs_only != 'true'
    needs: [version, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HUB_VERSION: ${{ needs.version.outputs.version }}
      HUB_CHANNEL: ${{ needs.version.outputs.channel }}
      HUB_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install actionlint (pinned, checksum-verified)
        # scripts/check.sh packaging lints the workflows when actionlint is on the PATH (it uses the runner's shellcheck).
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8   # actionlint_1.7.12_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Staticcheck version
        id: sc
        run: echo "version=$(sed -n 's/^STATICCHECK_VERSION="\(.*\)"/\1/p' scripts/check.sh)" >> "$GITHUB_OUTPUT"
      - name: Cache staticcheck binary
        # scripts/check.sh only runs `go install` when the binary in GOBIN has another version.
        uses: actions/cache@v6
        with:
          path: ~/go/bin/staticcheck
          key: staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ steps.sc.outputs.version }}-go${{ steps.go.outputs.go-version }}
      - name: Check Hub
        timeout-minutes: 20
        run: make check-hub
      - name: Hub tests with the race detector
        # check-hub runs with CGO_ENABLED=0; -race needs cgo (gcc is on the runner, sqlite is pure Go). CI-4.
        timeout-minutes: 15
        run: make check-hub-race
      - name: Build Hub (linux amd64 + arm64, windows amd64) and .deb packages
        run: |
          make build-hub
          make package-hub-deb
          # The amd64 binary runs on the runner: its version --json is the release info of the Hub.
          server/dist/uzume-server-linux-amd64 version --json > server/dist/hub-release-info.json
          cat server/dist/hub-release-info.json
          grep -qF "\"version\":\"$HUB_VERSION\"" server/dist/hub-release-info.json
          grep -qF "\"channel\":\"$HUB_CHANNEL\"" server/dist/hub-release-info.json
          # License texts travel with the raw binaries (GPL-3.0-or-later; third-party Go module licenses).
          cp LICENSE server/dist/LICENSE
          cp server/THIRD-PARTY-NOTICES.txt server/dist/THIRD-PARTY-NOTICES.txt
          ls -l server/dist
      - name: E2E Hub install and update (systemd)
        timeout-minutes: 15
        # Real install on the runner: install-server.sh, .deb install, signed update round trip (uses sudo).
        run: scripts/e2e-hub-update.sh
      - uses: actions/upload-artifact@v7
        with:
          name: uzume-server-linux
          path: |
            server/dist/uzume-server-linux-amd64
            server/dist/uzume-server-linux-arm64
            server/dist/uzume-server_*.deb
            server/dist/hub-release-info.json
            server/dist/LICENSE
            server/dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: uzume-server-windows
          path: server/dist/uzume-server-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  hub-docker:
    name: Hub (Docker image)
    # Builds the image for amd64 and arm64 and starts the amd64 one; never pushes (release.yml pushes, ADR 0029 D1).
    if: needs.changes.outputs.docs_only != 'true'
    needs: [version, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUB_VERSION: ${{ needs.version.outputs.version }}
      HUB_CHANNEL: ${{ needs.version.outputs.channel }}
      HUB_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 + linux/arm64 (no push)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/docker/Dockerfile \
            --build-arg HUB_VERSION="$HUB_VERSION" --build-arg HUB_CHANNEL="$HUB_CHANNEL" --build-arg HUB_COMMIT="$HUB_COMMIT" .
      - name: Start the amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load -t uzume-server:ci -f packaging/docker/Dockerfile \
            --build-arg HUB_VERSION="$HUB_VERSION" --build-arg HUB_CHANNEL="$HUB_CHANNEL" --build-arg HUB_COMMIT="$HUB_COMMIT" .
          docker run --rm uzume-server:ci version --json | tee "$RUNNER_TEMP/image-version.json"
          grep -qF "\"version\":\"$HUB_VERSION\"" "$RUNNER_TEMP/image-version.json"
          # A fresh named volume is writable by the non-root user: the Hub creates its database and answers on HTTPS.
          docker run -d --name hub-ci -p 8443:8443 -v hub-ci-data:/data uzume-server:ci
          for _ in $(seq 1 30); do
            curl -ksf -o /dev/null https://127.0.0.1:8443/.well-known/uzume && ok=1 && break
            sleep 1
          done
          docker logs hub-ci | tail -n 20
          [ "${ok:-0}" = 1 ]
          docker rm -f hub-ci

  hub-windows:
    name: Hub (Go, Windows)
    # Same triggers as client-windows (ADR 0008); also skipped for docs-only changes.
    # Not a required check unless the repository settings say so.
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [version, changes]
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      HUB_VERSION: ${{ needs.version.outputs.version }}
      HUB_CHANNEL: ${{ needs.version.outputs.channel }}
      HUB_COMMIT: ${{ needs.version.outputs.commit }}
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Build and check version
        working-directory: server
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/phabioo/uzume/server/internal/version.Version=$HUB_VERSION -X github.com/phabioo/uzume/server/internal/version.Channel=$HUB_CHANNEL -X github.com/phabioo/uzume/server/internal/version.Commit=$HUB_COMMIT" \
            -o dist/uzume-server-windows-amd64.exe ./cmd/uzume-server
          dist/uzume-server-windows-amd64.exe version --json | tee dist/hub-windows-info.json
          grep -qF "\"version\":\"$HUB_VERSION\"" dist/hub-windows-info.json
          grep -qF "\"channel\":\"$HUB_CHANNEL\"" dist/hub-windows-info.json

  client-linux:
    name: Player (C++, Linux)
    # Skipped for docs-only changes (see job changes).
    if: needs.changes.outputs.docs_only != 'true'
    needs: [version, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      flaky: ${{ steps.flaky.outputs.flaky }}
    env:
      UZUME_VERSION: ${{ needs.version.outputs.version }}
      UZUME_CHANNEL: ${{ needs.version.outputs.channel }}
      UZUME_COMMIT: ${{ needs.version.outputs.commit }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      # The Linux manifest has no dependencies (all vcpkg.json entries are Windows-only): no binary cache needed.
      VCPKG_BINARY_SOURCES: clear
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7
      - name: Image key and week key
        # ImageOS (ubuntu24) is set by the runner image; the key parts keep prefixes built on another image apart.
        id: week
        run: |
          echo "image=${ImageOS:-unknown}-$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg checkout
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/bootstrap-vcpkg.sh', 'client/vcpkg.json') }}
      # libdatachannel and SDL3 are built in explicit steps below and saved right after, so a failing test run
      # later does not throw away a long dependency build (a plain actions/cache step saves only when the job succeeds).
      - name: Restore libdatachannel
        id: cache-ddc
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uzume/deps/libdatachannel
          key: libdatachannel-linux-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/libdatachannel.pin', 'scripts/fetch-libdatachannel.sh') }}
      - name: Restore SDL3
        id: cache-sdl3
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uzume/deps/sdl3
          key: sdl3-linux-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/sdl3.pin', 'scripts/fetch-sdl3.sh') }}
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ steps.week.outputs.image }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ steps.week.outputs.image }}-
      - name: Provision tools and Qt 6.4
        timeout-minutes: 30
        run: |
          mapfile -t pkgs < <(grep -vE '^[[:space:]]*(#|$)' scripts/qt-packages.txt)
          scripts/ci-apt-install.sh "${pkgs[@]}" ccache
      - name: Bootstrap vcpkg
        timeout-minutes: 10
        run: scripts/bootstrap-vcpkg.sh
      - name: Build libdatachannel
        timeout-minutes: 45
        run: make fetch-deps
      - name: Save libdatachannel
        if: steps.cache-ddc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uzume/deps/libdatachannel
          key: ${{ steps.cache-ddc.outputs.cache-primary-key }}
      - name: Build SDL3
        timeout-minutes: 45
        run: make fetch-sdl3
      - name: Save SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uzume/deps/sdl3
          key: ${{ steps.cache-sdl3.outputs.cache-primary-key }}
      - name: Check Player
        timeout-minutes: 60
        env:
          # A failed test is retried once (scripts/check.sh); one that passes on the retry is a flaky-test warning, not a failure.
          UZUME_CTEST_RETRY: "1"
          UZUME_FLAKY_FILE: ${{ runner.temp }}/flaky-tests.txt
          # Merge CI uses the in-repo test core (ADR 0020 update 2026-10-11): no real core is fetched or built; the real-core
          # tests skip. A skipped *_testcore test fails the check; real cores are covered by cores-nightly.yml.
          UZUME_SKIP_CORES: "1"
          UZUME_REQUIRE_TESTCORE: "1"
          # The Vulkan render mode test runs on lavapipe (mesa-vulkan-drivers, scripts/qt-packages.txt): no device is a failure.
          UZUME_REQUIRE_VULKAN: "1"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: xvfb-run -a make check-client
      - name: Collect flaky tests
        id: flaky
        if: always()
        env:
          FLAKY_FILE: ${{ runner.temp }}/flaky-tests.txt
        run: |
          if [ -s "$FLAKY_FILE" ]; then
            echo "flaky=$(sort -u "$FLAKY_FILE" | paste -sd, -)" >> "$GITHUB_OUTPUT"
            { echo "### Flaky tests (Linux)"; sort -u "$FLAKY_FILE" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: ccache statistics
        if: always()
        run: ccache -s | head -n 12 || true
      - name: Save ccache
        # Only main saves (one entry per merge); PR and branch runs restore it. Stale entries age out.
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}
      - name: Install Go for Hub E2E
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: E2E Player CLI against Hub
        timeout-minutes: 20
        # The E2E script builds the Hub and uzume-sign itself (go build), no extra build step needed.
        run: |
          scripts/e2e-player-hub.sh
          scripts/e2e-session.sh

  # Linux x86-64 AppImage of the app (milestone 0.24, docs/guides/packaging.md): release build of the app, the server
  # binary and the pinned AppImage tools, then a smoke test of the finished image. Runs parallel to client-linux (own
  # Release build; it shares only the dependency caches with it). Not part of the required checks.
  app-appimage:
    name: App package (AppImage, Linux)
    # Skipped for docs-only changes (see job changes); every other push, PR and main build runs it, because the beta
    # prerelease of main carries the AppImage (release.yml).
    if: needs.changes.outputs.docs_only != 'true'
    needs: [version, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UZUME_VERSION: ${{ needs.version.outputs.version }}
      UZUME_CHANNEL: ${{ needs.version.outputs.channel }}
      UZUME_COMMIT: ${{ needs.version.outputs.commit }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7
      - name: Image key and week key
        id: week
        run: |
          echo "image=${ImageOS:-unknown}-$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg checkout
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/bootstrap-vcpkg.sh', 'client/vcpkg.json') }}
      # Same keys as client-linux: whichever job runs first builds and saves the dependency, the other restores it.
      - name: Restore libdatachannel
        id: cache-ddc
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uzume/deps/libdatachannel
          key: libdatachannel-linux-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/libdatachannel.pin', 'scripts/fetch-libdatachannel.sh') }}
      - name: Restore SDL3
        id: cache-sdl3
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uzume/deps/sdl3
          key: sdl3-linux-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/sdl3.pin', 'scripts/fetch-sdl3.sh') }}
      - name: Restore AppImage tools
        id: cache-tools
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uzume/tools/appimage
          key: appimage-tools-${{ hashFiles('scripts/appimage-tools.pin', 'scripts/fetch-appimage-tools.sh') }}
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-appimage-${{ steps.week.outputs.image }}-${{ github.sha }}
          restore-keys: ccache-appimage-${{ steps.week.outputs.image }}-
      - name: Provision tools and Qt 6.4
        timeout-minutes: 30
        run: |
          mapfile -t pkgs < <(grep -vE '^[[:space:]]*(#|$)' scripts/qt-packages.txt)
          scripts/ci-apt-install.sh "${pkgs[@]}" ccache file qt6-wayland desktop-file-utils
      - name: Bootstrap vcpkg
        timeout-minutes: 10
        run: scripts/bootstrap-vcpkg.sh
      - name: Build libdatachannel
        timeout-minutes: 45
        run: make fetch-deps
      - name: Save libdatachannel
        if: steps.cache-ddc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uzume/deps/libdatachannel
          key: ${{ steps.cache-ddc.outputs.cache-primary-key }}
      - name: Build SDL3
        timeout-minutes: 45
        run: make fetch-sdl3
      - name: Save SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uzume/deps/sdl3
          key: ${{ steps.cache-sdl3.outputs.cache-primary-key }}
      - name: Fetch AppImage tools (pinned, checksum-verified)
        run: scripts/fetch-appimage-tools.sh
      - name: Save AppImage tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/uzume/tools/appimage
          key: ${{ steps.cache-tools.outputs.cache-primary-key }}
      - name: Build the app (Release)
        timeout-minutes: 75
        working-directory: client
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ddc="$(../scripts/fetch-libdatachannel.sh)"
          sdl="$(../scripts/fetch-sdl3.sh)"
          cmake --preset linux-release "-DCMAKE_PREFIX_PATH=$ddc" "-DSDL3_ROOT=$sdl" \
            "-DUZUME_VERSION=$UZUME_VERSION" "-DUZUME_CHANNEL=$UZUME_CHANNEL" "-DUZUME_COMMIT=$UZUME_COMMIT"
          cmake --build --preset linux-release --target uzume_app uzume_cli
      - name: ccache statistics
        if: always()
        run: ccache -s | head -n 12 || true
      - name: Save ccache
        # As in client-linux: only main saves (one entry per merge), PR and branch runs restore it.
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build server binary (bundled for "Only on this PC")
        # Same flags and version stamping as scripts/check.sh hub_build, built natively instead of downloading the
        # artifact of another job (no dependency between the jobs).
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist/hub
          go build -trimpath \
            -ldflags "-s -w -X github.com/phabioo/uzume/server/internal/version.Version=$UZUME_VERSION -X github.com/phabioo/uzume/server/internal/version.Channel=$UZUME_CHANNEL -X github.com/phabioo/uzume/server/internal/version.Commit=$UZUME_COMMIT" \
            -o ../dist/hub/uzume-server ./cmd/uzume-server
          ../dist/hub/uzume-server version --json | tee ../dist/hub/hub-info.json
          grep -qF "\"version\":\"$UZUME_VERSION\"" ../dist/hub/hub-info.json
      - name: Assemble the AppImage
        timeout-minutes: 20
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          APP_SERVER: ${{ github.workspace }}/dist/hub/uzume-server
          APP_OUT: ${{ github.workspace }}/dist/appimage
        run: |
          # Fails when the AppDir contains an emulator core (*_libretro.*, cores directory) or an unresolved library.
          make package-app-appimage
          ls -l "$APP_OUT"/*.AppImage
      - name: Package smoke test
        timeout-minutes: 15
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # the runner has no FUSE
          QT_QUICK_BACKEND: software
        run: |
          set -euo pipefail
          img="$(ls "$GITHUB_WORKSPACE"/dist/appimage/Uzume-*-x86_64.AppImage)"
          dist="$GITHUB_WORKSPACE/dist/appimage"
          out="$RUNNER_TEMP/appimage-logs"
          mkdir -p "$out"
          # 1) Release info (as the Windows job): version and channel of this build.
          "$img" --version-json | tee "$dist/player-release-info-linux.json"
          jq -e --arg v "$UZUME_VERSION" --arg c "$UZUME_CHANNEL" '.product == "player" and .version == $v and .channel == $c' "$dist/player-release-info-linux.json" >/dev/null \
            || { echo "::error::--version-json does not report product player, version $UZUME_VERSION, channel $UZUME_CHANNEL"; exit 1; }
          # 2) Static: unpack, no "not found" library for any executable or library; no cores; the bundled server runs.
          work="$RUNNER_TEMP/appimage-unpacked"
          rm -rf "$work"; mkdir -p "$work"
          # Unset the extract-and-run switch here, or the runtime may start the app instead of unpacking it.
          (cd "$work" && env -u APPIMAGE_EXTRACT_AND_RUN "$img" --appimage-extract >/dev/null) || { echo "::error::--appimage-extract failed"; exit 1; }
          [ -d "$work/squashfs-root/usr" ] || { echo "::error::--appimage-extract produced no squashfs-root/usr"; exit 1; }
          root="$work/squashfs-root"
          notfound="$(find "$root/usr" -type f -print0 | while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in ELF*) LD_LIBRARY_PATH="$root/usr/lib" ldd "$f" 2>/dev/null | grep 'not found' | sed "s|^|${f#"$root"/}: |" || true ;; esac
          done | sort -u)"
          if [ -n "$notfound" ]; then echo "$notfound"; echo "::error::unresolved libraries in the AppImage"; exit 1; fi
          if [ -n "$(find "$root" \( -name '*_libretro.*' -o -type d -iname cores \) -print)" ]; then echo "::error::emulator core in the AppImage"; exit 1; fi
          for f in LICENSE THIRD-PARTY-NOTICE.txt THIRD-PARTY-NOTICES-server.txt; do test -s "$root/usr/share/doc/uzume/$f" || { echo "::error::missing or empty usr/share/doc/uzume/$f in the AppImage"; exit 1; }; done
          [ -n "$(ls "$root"/usr/share/doc/uzume/licenses 2>/dev/null)" ] || { echo "::error::usr/share/doc/uzume/licenses is missing or empty"; exit 1; }
          "$root/usr/bin/uzume-server" version --json | tee "$work/server-info.json"
          jq -e --arg v "$UZUME_VERSION" '.version == $v' "$work/server-info.json" >/dev/null \
            || { echo "::error::bundled uzume-server version is not $UZUME_VERSION"; exit 1; }
          # 3) Dynamic, through the image as users start it: --smoke-test loads the QML UI offscreen (QML modules,
          # imageformats, platform plugin); the loader fails before main() when a library is missing.
          export HOME="$RUNNER_TEMP/appimage-home"; rm -rf "$HOME"; mkdir -p "$HOME"
          unset UZUME_DATA_DIR
          QT_QPA_PLATFORM=offscreen timeout 90 "$img" --smoke-test
          # 4) Start the GUI for a few seconds, once offscreen and once on the xcb platform (Xvfb); it must keep running
          # (timeout exits 124) and print no missing-library or plugin errors. The data folder must be the XDG one even
          # though extract-and-run mode unpacks into a writable folder.
          for plat in offscreen xcb; do
            rc=0
            if [ "$plat" = xcb ]; then
              QT_QPA_PLATFORM=xcb timeout 8 xvfb-run -a "$img" >"$out/gui-$plat.log" 2>&1 || rc=$?
            else
              QT_QPA_PLATFORM=offscreen timeout 8 "$img" >"$out/gui-$plat.log" 2>&1 || rc=$?
            fi
            tail -n 20 "$out/gui-$plat.log"
            if [ "$rc" != 124 ] && [ "$rc" != 0 ]; then echo "::error::GUI ($plat) exited with code $rc"; exit 1; fi
            if grep -Ei 'error while loading shared libraries|cannot open shared object|could not load the qt platform plugin|module ".*" is not installed|no qt platform plugin' "$out/gui-$plat.log"; then
              echo "::error::missing library or plugin on platform $plat"; exit 1
            fi
          done
          test -f "$HOME/.local/share/Uzume/Uzume/device.json" || { find "$HOME/.local/share" | head -n 20; echo "::error::data folder is not the XDG data location"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: uzume-app-linux-x64
          path: |
            dist/appimage/Uzume-*-x86_64.AppImage
            dist/appimage/player-release-info-linux.json
          if-no-files-found: error
          retention-days: 7

  client-windows:
    name: Player (C++, Windows MSVC)
    # ADR 0008: PRs, manual runs, pushes to main (cache priming and beta releases).
    # Also skipped for docs-only changes (see job changes).
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [version, changes]
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    outputs:
      flaky: ${{ steps.test.outputs.flaky }}
    env:
      UZUME_VERSION: ${{ needs.version.outputs.version }}
      UZUME_CHANNEL: ${{ needs.version.outputs.channel }}
      UZUME_COMMIT: ${{ needs.version.outputs.commit }}
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@v7
      - name: Cache vcpkg checkout
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
      - name: Bootstrap vcpkg at baseline commit
        timeout-minutes: 20
        shell: pwsh
        run: |
          # Own checkout instead of VCPKG_INSTALLATION_ROOT: the runner's copy is
          # not pinned to builtin-baseline and its version database may be missing.
          $baseline = (Get-Content client/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            New-Item -ItemType Directory -Force $env:VCPKG_ROOT | Out-Null
            git -C $env:VCPKG_ROOT init -q
            git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg
            git -C $env:VCPKG_ROOT fetch -q --depth 1 origin $baseline
            git -C $env:VCPKG_ROOT checkout -q --force $baseline
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }
      - name: Install Qt 6.8
        timeout-minutes: 30
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.8.*
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Identify vcpkg cache toolchain
        id: vcpkg-toolchain
        shell: pwsh
        run: |
          $version = (Get-Item (Get-Command cl.exe).Source).VersionInfo.ProductVersion
          if (-not $version) { throw "MSVC compiler version is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install ccache (pinned, checksum-verified)
        # Compiler cache for the Player's own sources (the Release build has no /Zi debug info, which ccache cannot cache).
        id: ccache
        shell: pwsh
        env:
          CCACHE_VERSION: "4.13.4"
          CCACHE_SHA256: 12e8958ef3fc1fecceb650d46e4db5d0855c778312c70eedd3a2da344fd0a698   # ccache-4.13.4-windows-x86_64.zip
        run: |
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          $uri = "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/ccache-$env:CCACHE_VERSION-windows-x86_64.zip"
          # A network blip must not fail the run (release.yml needs a green main run): 4 attempts, backoff 5/10/20 s.
          # The checksum is verified after the download, a mismatch is never retried.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile $zip -TimeoutSec 120
              break
            } catch {
              if ($attempt -eq 4) { throw }
              $wait = 5 * [math]::Pow(2, $attempt - 1)
              Write-Host "ccache download failed (attempt $attempt): $($_.Exception.Message); retrying in $wait s"
              Start-Sleep -Seconds $wait
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne $env:CCACHE_SHA256) { throw "ccache checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $exe = "$env:RUNNER_TEMP\ccache-$env:CCACHE_VERSION-windows-x86_64\ccache.exe"
          if (-not (Test-Path $exe)) { throw "ccache.exe not found in the archive" }
          & $exe --version | Select-Object -First 1
          "path=$exe" >> $env:GITHUB_OUTPUT
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-${{ github.sha }}
          restore-keys: ccache-windows-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-
      - name: Restore vcpkg binary cache
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # A unique key lets each configure save additional ABI entries after a partial restore.
          key: vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-${{ hashFiles('client/vcpkg.json', 'client/CMakePresets.json', 'client/triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-${{ hashFiles('client/vcpkg.json', 'client/CMakePresets.json', 'client/triplets/*.cmake') }}-
            vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-
      - name: Record vcpkg binary cache state (before)
        id: vcpkg-before
        shell: pwsh
        run: |
          $f = @(Get-ChildItem -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File -ErrorAction SilentlyContinue)
          $size = ($f | Measure-Object -Property Length -Sum).Sum
          "files=$($f.Count)" >> $env:GITHUB_OUTPUT
          "bytes=$([int64]$size)" >> $env:GITHUB_OUTPUT
          Write-Host "vcpkg binary cache before: $($f.Count) files, $([int64]$size) bytes"
      - name: Configure
        timeout-minutes: 240
        working-directory: client
        env:
          CCACHE_EXE: ${{ steps.ccache.outputs.path }}
        # The launcher is a cache variable of this project only; vcpkg builds its ports in their own CMake runs.
        run: >-
          cmake --preset windows-msvc-release "-DUZUME_VERSION=$env:UZUME_VERSION" "-DUZUME_CHANNEL=$env:UZUME_CHANNEL"
          "-DUZUME_COMMIT=$env:UZUME_COMMIT" "-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE_EXE" "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE_EXE"
      # Save the binary cache right after vcpkg install (part of configure), even if
      # later steps fail, so a long FFmpeg build is never repeated. Only when this run added or changed entries
      # (file count or total size differs from the restored state): an unchanged cache is not uploaded again, which keeps
      # the repository cache quota free for useful entries. A push to main that restores an older prefix and builds the
      # missing ports still saves (ADR 0008 cache priming).
      - name: Record vcpkg binary cache state (after)
        id: vcpkg-after
        if: always() && steps.vcpkg-before.outcome == 'success'
        shell: pwsh
        run: |
          $f = @(Get-ChildItem -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File -ErrorAction SilentlyContinue)
          $size = [int64](($f | Measure-Object -Property Length -Sum).Sum)
          $changed = ($f.Count -ne [int]'${{ steps.vcpkg-before.outputs.files }}') -or ($size -ne [int64]'${{ steps.vcpkg-before.outputs.bytes }}')
          "changed=$("$changed".ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "vcpkg binary cache after: $($f.Count) files, $size bytes, changed=$changed"
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-binary-cache.outputs.cache-primary-key != '' && steps.vcpkg-after.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-binary-cache.outputs.cache-primary-key }}
      - name: Build
        timeout-minutes: 60
        working-directory: client
        env:
          # The MSVC version instead of cl.exe's mtime: the cache stays valid across runner VMs with the same toolchain.
          CCACHE_COMPILERCHECK: string:${{ steps.vcpkg-toolchain.outputs.version }}
        run: cmake --build --preset windows-msvc-release
      - name: ccache statistics
        if: always() && steps.ccache.outcome == 'success'
        shell: pwsh
        env:
          CCACHE_EXE: ${{ steps.ccache.outputs.path }}
        run: '& $env:CCACHE_EXE -s'
      - name: Save ccache
        # As on Linux: only main saves (one entry per merge), PR and branch runs restore it.
        if: always() && github.ref == 'refs/heads/main' && steps.cache-ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}
      - name: Test
        id: test
        timeout-minutes: 30
        working-directory: client
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # Tests also write their QtTest log here, so an intermittent failure shows its assertion from the first run.
          UZUME_TEST_LOG_DIR: ${{ github.workspace }}\testlogs
        run: |
          # Merge CI uses the in-repo test core only: the real-core tests skip (cores-nightly.yml runs them), every other
          # skip, in particular any *_testcore test, is an error (allowlist below). Tests run in parallel (own temp dirs, port 0).
          ctest --preset windows-msvc-release -j $env:NUMBER_OF_PROCESSORS 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) {
            # Re-run every failed test exe directly: QtTest output goes to a file (survives a crash) and to the
            # console, followed by the files and the exit code (0xC0000005 = access violation, 3/4 = abort/terminate).
            $failed = Select-String -Path ctest.log -Pattern '^\s*\d+/\d+ Test\s+#\d+: (\S+) \.+\*{3}(Failed|Exception|Timeout)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
            $logDir = $env:UZUME_TEST_LOG_DIR
            # The direct rerun is the retry: a test that passes now is flaky (warning), any other outcome keeps the job red.
            $flaky = @()
            $stillFailing = @()
            foreach ($t in $failed) {
              $first = Join-Path $logDir "test_$t.txt"
              if (Test-Path $first) {
                Write-Host "::group::first run of $t ($first)"
                Select-String -Path $first -Pattern 'FAIL!|QFATAL' -Context 3,3 | Out-Host
                Get-Content $first | Select-Object -Last 60 | Out-Host
                Write-Host "::endgroup::"
              }
              $exe = Get-ChildItem -Recurse -Filter "test_$t.exe" | Select-Object -First 1
              if (-not $exe) { Write-Host "::warning::no exe for $t"; $stillFailing += $t; continue }
              Write-Host "::group::rerun $t ($($exe.FullName))"
              # Same environment as under ctest (core path, test ROM, offscreen): read from the test properties.
              $props = (ctest --preset windows-msvc-release -R "^$t$" --show-only=json-v1 | ConvertFrom-Json).tests[0].properties
              foreach ($kv in (($props | Where-Object { $_.name -eq 'ENVIRONMENT' }).value)) {
                $k, $v = $kv -split '=', 2
                Set-Item -Path "env:$k" -Value $v
              }
              # The first-run log is printed above and the rerun writes its own file; a second stdout logger makes QtTest exit at once.
              Remove-Item Env:UZUME_TEST_LOG_DIR -ErrorAction SilentlyContinue
              Push-Location $exe.DirectoryName
              # Two -o: file (survives a crash) AND stdout. "$t.txt,txt" is one argument "<file>,<format>".
              $txt = Join-Path $exe.DirectoryName "$t.txt"
              Remove-Item $txt -ErrorAction SilentlyContinue
              $out = & $exe.FullName -v2 -maxwarnings 0 -o "${txt},txt" -o "-,txt" 2>&1 | ForEach-Object { "$_" }
              $code = $LASTEXITCODE
              Pop-Location
              Write-Host "exit code of ${t}: $code (0x$('{0:X}' -f $code))"
              if ($code -eq 0) { $flaky += $t } else { $stillFailing += $t }
              # QtTest result file, unfiltered tail, then the interesting lines of it (and of the console output).
              if (Test-Path $txt) {
                Write-Host "--- $t.txt (last 80 lines) ---"
                Get-Content $txt | Select-Object -Last 80 | Out-Host
                Write-Host "--- FAIL!/QWARN/QFATAL in $t.txt ---"
                Select-String -Path $txt -Pattern 'FAIL!|QWARN|QFATAL' -Context 3,3 | Out-Host
              } else {
                Write-Host "::warning::$txt was not written"
              }
              Write-Host "--- console: guard lines, [loopback] and failures ---"
              $out | Select-String -Pattern 'FAIL!|QFATAL|Totals|\[fbtest\]|\[uitest\]|\[loopback\]' | Out-Host
              Write-Host "::endgroup::"
            }
            if ($failed.Count -eq 0 -or $stillFailing.Count -gt 0) { throw "ctest failed" }
            foreach ($t in $flaky) { Write-Host "::warning title=Flaky test::$t failed once and passed on retry" }
            "flaky=$($flaky -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "### Flaky tests (Windows)`n$(($flaky | ForEach-Object { "- $_" }) -join "`n")" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            # Skip check below still reads ctest.log of the first run; the flaky tests passed on the retry, not skipped.
          }
          # Allowed skips: the real-core tests (no cores in merge CI) and the GL/GPU tests (no GL 3.3 context, ADR 0013 D6);
          # emulation_core_gl_testcore may skip only for lack of GL. Any other skip, e.g. emulation_test_core or another *_testcore
          # test, is an error. (\b does not split at "_", so emulation_core does not match emulation_core_gl_testcore.)
          $skipped = @(Select-String -Path ctest.log -Pattern '\(Skipped\)|\*\*\*Skipped' | ForEach-Object { $_.Line })
          $allowed = '\b(emulation_core_options|emulation_core|emulation_core_speed|emulation_core_gl|emulation_core_desmume|emulation_core_gl_testcore|emulation_hw_render|emulation_vk_render|emulation_vk_display|emulation_vk_encode|media_cuda_gl_capture|media_cuda_gl_hw|media_d3d11_ring|ui_gpu_encode|ui_gpu_display)\b'
          if (@($skipped | Where-Object { $_ -notmatch $allowed }).Count -gt 0) { throw "Unexpected skipped tests (test-core tests must run)" }
          if ($skipped.Count -gt 0) { Write-Host "Note: real-core and GL tests skipped (allowed: no cores in merge CI, ADR 0020; no GL 3.3 context, ADR 0013 D6)" }
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build server exe (for the app package and the MSI)
        # Built natively here (same flags and version stamping as scripts/check.sh hub_build) instead of downloading the
        # artifact of job hub-windows: no dependency between the jobs, no artifact-name coupling.
        shell: bash
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist/hub
          go build -trimpath \
            -ldflags "-s -w -X github.com/phabioo/uzume/server/internal/version.Version=$UZUME_VERSION -X github.com/phabioo/uzume/server/internal/version.Channel=$UZUME_CHANNEL -X github.com/phabioo/uzume/server/internal/version.Commit=$UZUME_COMMIT" \
            -o ../dist/hub/uzume-server.exe ./cmd/uzume-server
          ../dist/hub/uzume-server.exe version --json | tee ../dist/hub/hub-info.json
          grep -qF "\"version\":\"$UZUME_VERSION\"" ../dist/hub/hub-info.json
      - name: Assemble package (windeployqt)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Layout (spec 0.3 S6): the tiny launcher and the notice at the top, everything else in bin\.
          $dist = "$env:GITHUB_WORKSPACE\dist\uzume-app"
          $bin = "$dist\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          # The launcher (target uzume_launcher) is built to <build>\launcher\Uzume.exe; the real Player
          # is the only other Uzume.exe in the build tree.
          $build = "client\build\windows-msvc-release"
          $launcher = Get-Item "$build\launcher\Uzume.exe" -ErrorAction SilentlyContinue
          if (-not $launcher) { throw "launcher not found: $build\launcher\Uzume.exe" }
          $launcherDir = (Resolve-Path "$build\launcher").Path
          $reals = @(Get-ChildItem -Recurse -Filter Uzume.exe $build | Where-Object { -not $_.DirectoryName.StartsWith($launcherDir, [StringComparison]::OrdinalIgnoreCase) })
          if ($reals.Count -ne 1) { throw "expected exactly one real Uzume.exe outside launcher\, found $($reals.Count): $($reals.FullName -join ', ')" }
          $real = $reals[0]
          if ($launcher.Length -ge $real.Length) { throw "launcher ($($launcher.Length) bytes) is not smaller than the Player ($($real.Length) bytes)" }
          Write-Host "Launcher: $($launcher.FullName)"
          Write-Host "Player:   $($real.FullName)"
          Copy-Item $launcher.FullName "$dist\Uzume.exe"
          Copy-Item $real.FullName "$bin\Uzume.exe"
          # The server next to the real app: "Only on this PC" starts it as a child process (ADR 0030 D6). The MSI installs the
          # same exe a second time as the service program when the server option is chosen.
          Copy-Item "$env:GITHUB_WORKSPACE\dist\hub\uzume-server.exe" "$bin\uzume-server.exe"
          # vcpkg runtime DLLs (libdatachannel, FFmpeg, OpenH264, Opus, speexdsp, SDL3 and their transitive DLLs): windeployqt only
          # deploys Qt. vcpkg's applocal step puts them next to the exe; fall back to the release bin directory of
          # the manifest install (never debug\bin). Qt DLLs are left to windeployqt.
          $sources = @($real.DirectoryName)
          $installed = @(Get-ChildItem -Recurse -Directory -Filter 'vcpkg_installed' client\build\windows-msvc-release -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'x64-windows-release\bin' } | Where-Object { Test-Path $_ })
          $sources += $installed
          foreach ($src in ($sources | Select-Object -Unique)) {
            foreach ($f in (Get-ChildItem -Path $src -Filter *.dll -File)) {
              if ($f.Name -like 'Qt6*.dll') { continue }
              if (-not (Test-Path "$bin\$($f.Name)")) { Copy-Item $f.FullName $bin }
            }
          }
          Write-Host "Bundled non-Qt DLLs: $((Get-ChildItem $bin -Filter *.dll | ForEach-Object Name) -join ', ')"
          foreach ($need in 'datachannel', 'avutil', 'avcodec', 'swscale', 'opus', 'speexdsp', 'SDL3') {
            if (-not (Get-ChildItem $bin -Filter "*$need*.dll")) { throw "Runtime DLL matching *$need*.dll is missing from the package" }
          }
          windeployqt --release --no-translations --qmldir client\ui "$bin\Uzume.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          if (Get-ChildItem $dist -Filter *.dll) { throw "DLLs at the top level of the package: only the launcher belongs there" }
          # No emulator cores in the package: the app downloads them from the Uzume server on demand. Guard: no
          # *_libretro.* library and no cores directory anywhere in the dist (the MSI is harvested from this directory).
          $coreLeak = @(Get-ChildItem -Path $dist -Recurse -Force | Where-Object { $_.Name -like '*_libretro.*' -or ($_.PSIsContainer -and $_.Name -ieq 'cores') })
          if ($coreLeak.Count -gt 0) { $coreLeak | ForEach-Object { Write-Host "::error::emulator core in package: $($_.FullName)" }; throw "Emulator cores must not be part of the package" }
          # License material (GPL-3.0-or-later): notice, LICENSE.txt and licenses\ with the vcpkg port copyrights and Qt's LGPL-3.0.
          Copy-Item packaging\windows\THIRD-PARTY-NOTICE.txt "$dist\THIRD-PARTY-NOTICE.txt"
          Copy-Item LICENSE "$dist\LICENSE.txt"
          $lic = New-Item -ItemType Directory -Force -Path "$dist\licenses"
          Copy-Item packaging\windows\licenses\*.txt $lic.FullName
          $shares = @(Get-ChildItem -Recurse -Directory -Filter 'vcpkg_installed' client\build\windows-msvc-release -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'x64-windows-release\share' } | Where-Object { Test-Path $_ })
          foreach ($share in $shares) {
            foreach ($port in (Get-ChildItem -Path $share -Directory)) {
              $cr = Join-Path $port.FullName 'copyright'
              if (Test-Path $cr) { Copy-Item $cr (Join-Path $lic.FullName "$($port.Name).txt") -Force }
            }
          }
          Write-Host "Bundled licenses: $((Get-ChildItem $lic.FullName | ForEach-Object Name) -join ', ')"
      - name: Package smoke check
        timeout-minutes: 15
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\uzume-app"
          $bin = "$dist\bin"
          $launcher = "$dist\Uzume.exe"
          # 0) License material: notice, LICENSE.txt and a non-empty licenses\ directory.
          foreach ($f in 'THIRD-PARTY-NOTICE.txt', 'LICENSE.txt') {
            if (-not (Test-Path "$dist\$f")) { throw "$f is missing from the package" }
          }
          if (-not (Get-ChildItem "$dist\licenses" -File -ErrorAction SilentlyContinue)) { throw "licenses\ is missing or empty in the package" }
          # 1) Static: every non-system import of the executables and of the bundled DLLs must be in the package.
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            $missing = @()
            foreach ($bin1 in (@($launcher, "$bin\Uzume.exe") + (Get-ChildItem $bin -Filter *.dll | ForEach-Object FullName))) {
              $dir = [IO.Path]::GetDirectoryName($bin1)
              foreach ($line in (& $dumpbin.Source /dependents $bin1)) {
                if ($line -match '^\s+(\S+\.dll)\s*$') {
                  $d = $Matches[1]
                  if ($d -match '^(api-ms-win-|ext-ms-win-)' -or (Test-Path "$dir\$d") -or (Test-Path "$env:SystemRoot\System32\$d")) { continue }
                  $missing += "$([IO.Path]::GetFileName($bin1)) -> $d"
                }
              }
            }
            $missing = $missing | Sort-Object -Unique
            if ($missing) { $missing | ForEach-Object { Write-Host "::error::missing dependency: $_" }; throw "Package is missing DLLs" }
            Write-Host "dumpbin: all non-system dependencies are in the package"
          } else {
            Write-Host "::warning::dumpbin not available, skipping static dependency check"
          }
          # 2) Dynamic, through the top-level launcher (as users start it): --version needs no window and no Hub; the
          # loader fails before main() when a DLL is missing. --smoke-test additionally loads the QML UI (offscreen).
          foreach ($argSet in @(@('--version'), @('--smoke-test'))) {
            $p = Start-Process -FilePath $launcher -ArgumentList $argSet -WorkingDirectory $dist -PassThru -NoNewWindow
            $null = $p.Handle  # cache the handle, otherwise ExitCode can be empty
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$argSet did not exit within 60 s" }
            $code = $p.ExitCode
            Write-Host "Uzume.exe $argSet exit code: $code (0x$('{0:X8}' -f $code))"
            if ($code -eq -1073741515 -or $code -eq 3221225781) {
              throw "STATUS_DLL_NOT_FOUND (0xC0000135): a runtime DLL is missing from the package"
            }
            if ($code -ne 0) { throw "Uzume.exe $argSet failed with exit code $code" }
          }
          # 3) Release info: --version-json with redirected stdout (the launcher passes its handles on).
          $out = "$env:GITHUB_WORKSPACE\dist\zip\player-release-info.json"
          New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
          $err = "$env:RUNNER_TEMP\version-json.err"
          $p = Start-Process -FilePath $launcher -ArgumentList '--version-json' -WorkingDirectory $dist -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "--version-json did not exit within 60 s" }
          if ($p.ExitCode -ne 0) { throw "--version-json failed with exit code $($p.ExitCode)" }
          Get-Content $out | Write-Host
          $info = Get-Content $out -Raw | ConvertFrom-Json
          if ($info.product -ne 'player') { throw "release info: product is '$($info.product)'" }
          if ($info.version -ne $env:UZUME_VERSION) { throw "release info: version '$($info.version)' != $env:UZUME_VERSION" }
          if ($info.channel -ne $env:UZUME_CHANNEL) { throw "release info: channel '$($info.channel)' != $env:UZUME_CHANNEL" }
          # 4) Portable zip (one top-level folder).
          $zip = "$env:GITHUB_WORKSPACE\dist\zip\uzume-$($env:UZUME_VERSION)-windows-x64.zip"
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: uzume-app-windows-x64
          path: |
            dist/zip/uzume-*-windows-x64.zip
            dist/zip/player-release-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Build MSI (WiX v5)
        timeout-minutes: 30
        shell: pwsh
        env:
          CORE_VERSION: ${{ needs.version.outputs.core }}
        run: |
          # ProductVersion must be numeric: X.Y.Z plus the run number as 4th field (ignored by Windows Installer's upgrade logic).
          # Compression: the published beta MSI (push to main) keeps the release setting high; dev builds use mszip and the two
          # test-only MSIs none, which binds in a fraction of the time (high LZX over the whole package takes over a minute each).
          $level = if ($env:UZUME_CHANNEL -eq 'beta') { 'high' } else { 'mszip' }
          $msi = "$env:GITHUB_WORKSPACE\dist\msi\uzume-$($env:UZUME_VERSION)-windows-x64.msi"
          packaging\windows\build-msi.ps1 -ProductVersion "$env:CORE_VERSION.${{ github.run_number }}" -CompressionLevel $level `
            -PackageDir "$env:GITHUB_WORKSPACE\dist\uzume-app" -HubExe "$env:GITHUB_WORKSPACE\dist\hub\uzume-server.exe" -OutFile $msi
          if (-not (Test-Path $msi)) { throw "MSI was not produced" }
          # An older build of the same product (other product code) for the per-user -> per-machine switch test.
          packaging\windows\build-msi.ps1 -ProductVersion "0.0.1.0" -CompressionLevel none `
            -PackageDir "$env:GITHUB_WORKSPACE\dist\uzume-app" -HubExe "$env:GITHUB_WORKSPACE\dist\hub\uzume-server.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\dist\msi-old\uzume-old.msi"
          # Same version, new product code: an upgrade of the main MSI (as the Hub updater runs it).
          packaging\windows\build-msi.ps1 -ProductVersion "$env:CORE_VERSION.${{ github.run_number }}" -CompressionLevel none `
            -PackageDir "$env:GITHUB_WORKSPACE\dist\uzume-app" -HubExe "$env:GITHUB_WORKSPACE\dist\hub\uzume-server.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\dist\msi-upgrade\uzume-upgrade.msi"
      - name: MSI test (a) Player only, per user
        timeout-minutes: 15
        shell: pwsh
        run: scripts\test-windows-msi.ps1 -Scenario user -Msi "dist\msi\uzume-$($env:UZUME_VERSION)-windows-x64.msi"
      - name: MSI test (b) Player and Hub, per machine
        timeout-minutes: 15
        shell: pwsh
        run: scripts\test-windows-msi.ps1 -Scenario machine -Msi "dist\msi\uzume-$($env:UZUME_VERSION)-windows-x64.msi" -OldMsi dist\msi-old\uzume-old.msi -UpgradeMsi dist\msi-upgrade\uzume-upgrade.msi -Version $env:UZUME_VERSION
      - name: Upload MSI test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uzume-msi-test-logs
          path: ${{ runner.temp }}/uzume-msi-test-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: uzume-windows-x64-msi
          path: dist/msi/uzume-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 7

  # Reports tests that failed once and passed on the retry (client-linux, client-windows) as one issue on main, so a flake
  # stays visible although the job is green. Never closes the issue: whoever fixes the flake closes it.
  flaky-report:
    name: Flaky test report
    needs: [client-linux, client-windows]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LINUX_FLAKY: ${{ needs.client-linux.outputs.flaky }}
      WINDOWS_FLAKY: ${{ needs.client-windows.outputs.flaky }}
      COMMIT: ${{ github.sha }}
      ISSUE_TITLE: Flaky tests
      ISSUE_LABEL: flaky-tests
    steps:
      - name: Open or update the issue
        run: |
          set -euo pipefail
          [ -n "$LINUX_FLAKY" ] || [ -n "$WINDOWS_FLAKY" ] || exit 0
          gh label create "$ISSUE_LABEL" --description "Tests that failed once and passed on retry (ci.yml)" --color fbca04 2>/dev/null || true
          existing="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          body="Failed once and passed on retry in $COMMIT: $RUN_URL"
          [ -z "$LINUX_FLAKY" ] || body="$body"$'\n'"Linux: $LINUX_FLAKY"
          [ -z "$WINDOWS_FLAKY" ] || body="$body"$'\n'"Windows: $WINDOWS_FLAKY"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
          fi
