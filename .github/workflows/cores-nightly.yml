name: Cores (nightly)

# Real emulator cores (melonDS DS, DeSmuME) from the libretro buildbot, ADR 0020. Merge CI (ci.yml) tests with the in-repo
# test core and fetches no real core; this workflow runs the real-core tests once a day. It is not part of the required
# checks (own workflow, own job names) and a failure opens or updates the issue "Nightly core tests failed".

on:
  schedule:
    - cron: "30 3 * * *"   # daily, 03:30 UTC
  workflow_dispatch:

concurrency:
  group: cores-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Real-core tests: the *_testcore variants and everything else run in ci.yml.
  CORE_TESTS: ^(emulation_core_options|emulation_core|emulation_core_speed|emulation_core_gl|emulation_core_desmume|ui_game|ui_save|ui_sessions|ui_emulation_controllers)$

jobs:
  cores-linux:
    name: Real cores (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7
      - name: Image key and week key
        id: week
        run: |
          echo "image=${ImageOS:-unknown}-$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg checkout
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/bootstrap-vcpkg.sh', 'client/vcpkg.json') }}
      - name: Cache buildbot cores (per week)
        uses: actions/cache@v6
        with:
          path: ~/.cache/uzume/cores/buildbot
          key: cores-linux-${{ steps.week.outputs.image }}-${{ steps.week.outputs.week }}
      - name: Cache libdatachannel
        uses: actions/cache@v6
        with:
          path: ~/.cache/uzume/deps/libdatachannel
          key: libdatachannel-linux-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/libdatachannel.pin', 'scripts/fetch-libdatachannel.sh') }}
      - name: Cache SDL3
        uses: actions/cache@v6
        with:
          path: ~/.cache/uzume/deps/sdl3
          key: sdl3-linux-${{ steps.week.outputs.image }}-${{ hashFiles('scripts/sdl3.pin', 'scripts/fetch-sdl3.sh') }}
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ steps.week.outputs.image }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ steps.week.outputs.image }}-
      - name: Provision tools and Qt 6.4
        timeout-minutes: 30
        run: |
          mapfile -t pkgs < <(grep -vE '^[[:space:]]*(#|$)' scripts/qt-packages.txt)
          scripts/ci-apt-install.sh "${pkgs[@]}" ccache
      - name: Bootstrap vcpkg
        timeout-minutes: 10
        run: scripts/bootstrap-vcpkg.sh
      - name: Build libdatachannel
        timeout-minutes: 45
        run: make fetch-deps
      - name: Build SDL3
        timeout-minutes: 45
        run: make fetch-sdl3
      - name: Fetch cores, build and run the real-core tests
        timeout-minutes: 60
        env:
          # Fetches melonDS DS and DeSmuME from the buildbot (a failed fetch fails the job) and fails when a real-core test skips.
          UZUME_REQUIRE_CORES: "1"
          UZUME_CTEST_REGEX: ${{ env.CORE_TESTS }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: xvfb-run -a make check-client

  cores-windows:
    name: Real cores (Windows MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      UZUME_CACHE_DIR: ${{ github.workspace }}\.uzume-cache
    steps:
      - uses: actions/checkout@v7
      - name: Cache vcpkg checkout
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
      - name: Bootstrap vcpkg at baseline commit
        timeout-minutes: 20
        shell: pwsh
        run: |
          $baseline = (Get-Content client/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            New-Item -ItemType Directory -Force $env:VCPKG_ROOT | Out-Null
            git -C $env:VCPKG_ROOT init -q
            git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg
            git -C $env:VCPKG_ROOT fetch -q --depth 1 origin $baseline
            git -C $env:VCPKG_ROOT checkout -q --force $baseline
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }
      - name: Week key for the buildbot core cache
        id: week
        shell: pwsh
        run: |
          $d = (Get-Date).ToUniversalTime()
          "week=$([Globalization.ISOWeek]::GetYear($d))-$('{0:00}' -f [Globalization.ISOWeek]::GetWeekOfYear($d))" >> $env:GITHUB_OUTPUT
      - name: Cache buildbot cores (per week)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.uzume-cache\cores\buildbot
          key: cores-windows-${{ steps.week.outputs.week }}
      - name: Install Qt 6.8
        timeout-minutes: 30
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.8.*
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Fetch cores (libretro buildbot, ADR 0020)
        id: cores
        shell: pwsh
        run: |
          # Fails with a clear error when the buildbot is unreachable or the CRC32 does not match.
          foreach ($c in 'melondsds', 'desmume') {
            $dll = scripts/fetch-buildbot-core.ps1 $c | Select-Object -Last 1
            if (-not $dll -or -not (Test-Path $dll)) { throw "$c core was not provisioned" }
            "$c=$dll" >> $env:GITHUB_OUTPUT
          }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Identify vcpkg cache toolchain
        id: vcpkg-toolchain
        shell: pwsh
        run: |
          $version = (Get-Item (Get-Command cl.exe).Source).VersionInfo.ProductVersion
          if (-not $version) { throw "MSVC compiler version is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        # Restore only: ci.yml primes this cache on every push to main (same key prefix).
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-nightly-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-${{ hashFiles('client/vcpkg.json', 'client/CMakePresets.json', 'client/triplets/*.cmake') }}-
            vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-
      - name: Configure
        timeout-minutes: 200
        working-directory: client
        run: cmake --preset windows-msvc-release "-DUZUME_MELONDS_DS_CORE=${{ steps.cores.outputs.melondsds }}" "-DUZUME_DESMUME_CORE=${{ steps.cores.outputs.desmume }}"
      - name: Build
        timeout-minutes: 60
        working-directory: client
        run: cmake --build --preset windows-msvc-release
      - name: Run the real-core tests
        timeout-minutes: 30
        working-directory: client
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset windows-msvc-release -R $env:CORE_TESTS 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) { throw "ctest failed" }
          # Both cores are present: a skipped test is an error, except the GL test without a GL 3.3 context (ADR 0013 D6).
          $skipped = @(Select-String -Path ctest.log -Pattern '\(Skipped\)|\*\*\*Skipped' | ForEach-Object { $_.Line })
          if (@($skipped | Where-Object { $_ -notmatch '\bemulation_core_gl\b' }).Count -gt 0) { throw "Real-core tests were skipped although the cores are present" }

  # Reports the result of scheduled runs as one issue. Only this job may write issues.
  report:
    name: Report nightly result
    needs: [cores-linux, cores-windows]
    if: always() && github.event_name == 'schedule' && (needs.cores-linux.result != 'cancelled' && needs.cores-windows.result != 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LINUX_RESULT: ${{ needs.cores-linux.result }}
      WINDOWS_RESULT: ${{ needs.cores-windows.result }}
      ISSUE_TITLE: Nightly core tests failed
      ISSUE_LABEL: nightly-cores
    steps:
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --description "Real-core tests (cores-nightly.yml)" --color d93f0b 2>/dev/null || true
          existing="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ "$LINUX_RESULT" = success ] && [ "$WINDOWS_RESULT" = success ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Nightly core tests pass again: $RUN_URL"
              gh issue close "$existing" --reason completed
            fi
            exit 0
          fi
          body="Nightly core tests failed (Linux: $LINUX_RESULT, Windows: $WINDOWS_RESULT): $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
          fi
