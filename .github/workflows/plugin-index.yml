name: Publish plugin

# Publishes the official signed plugin index (release "plugin-index" of this repo): optionally takes the *.uzplugin
# (legacy: *.fbplugin) file(s) of a release of an official plugin repo, signs them with the release key, adds them to plugin-index.json,
# signs the index and uploads everything. Without inputs it only re-signs and publishes the existing (or an empty)
# index. Servers read https://github.com/phabioo/uzume/releases/download/plugin-index/plugin-index.json by default.
# The signing seed is the signing-key secret of the environment `release` (dispatch from main); it is only in
# the environment of the signing steps. Private plugin repos: set the secret PLUGIN_REPOS_TOKEN (PAT, read access).

on:
  schedule:
    - cron: "17 4 * * 1"   # weekly re-sign without inputs: new generated_at/expires_at (ADR 0016 amendment 2026-10-19)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Plugin repo, e.g. phabioo/uzume-plugin-soullink-core (empty = only re-sign the index)'
        required: false
        default: ''
        type: string
      tag:
        description: 'Release tag in that repo, e.g. v0.1.0'
        required: false
        default: ''
        type: string
      remove_ids:
        description: 'Plugin ids to remove from the index, space- or comma-separated (e.g. uzume.soullink); their files are deleted after the new index is published'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One index update at a time (read-modify-write on the index release); a running publish is never cancelled.
concurrency:
  group: plugin-index
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin and update the index
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write   # create the index release, upload assets
    env:
      GH_REPO: ${{ github.repository }}
      INPUT_REPO: ${{ inputs.repo }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_REMOVE_IDS: ${{ inputs.remove_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ] || [ -n "$INPUT_TAG" ]; then
            if [ -z "$INPUT_REPO" ] || [ -z "$INPUT_TAG" ]; then
              echo "::error::repo and tag must be given together"
              exit 1
            fi
            [[ "$INPUT_REPO" =~ ^phabioo/uzume-plugin-[a-z0-9-]+$ ]] || { echo "::error::repo must match phabioo/uzume-plugin-<name>"; exit 1; }
            [[ "$INPUT_TAG" =~ ^v?[0-9][0-9A-Za-z._-]*$ ]] || { echo "::error::invalid tag"; exit 1; }
          fi
          # Ids to remove: validated here, before anything is published; one id per line in remove-ids.txt.
          : > "$RUNNER_TEMP/remove-ids.txt"
          for rid in ${INPUT_REMOVE_IDS//,/ }; do
            [[ "$rid" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || { echo "::error::invalid id in remove_ids: ${rid:0:80}"; exit 1; }
            echo "$rid" >> "$RUNNER_TEMP/remove-ids.txt"
          done
          sort -u -o "$RUNNER_TEMP/remove-ids.txt" "$RUNNER_TEMP/remove-ids.txt"
      - name: Build uzume-sign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/uzume-sign" ./cmd/uzume-sign)
      - name: Signing key is trusted by the Hub (before anything is published)
        env:
          UZUME_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: scripts/check-signing-key.sh "$RUNNER_TEMP/bin/uzume-sign"
      - name: Fetch the current index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/plugin-index"
          rm -rf "$work"; mkdir -p "$work"
          # Only a real "release not found" may start from an empty index; any other gh error stops the job so the
          # index is never replaced by an empty one.
          rc=0
          assets="$(gh release view plugin-index --json assets --jq '.assets[].name' 2>"$work/gh-err.txt")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -qi 'release not found' "$work/gh-err.txt" || { echo "::error::could not read the plugin-index release: $(head -c 300 "$work/gh-err.txt")"; exit 1; }
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
            assets=""
          else
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
          fi
          if grep -qx plugin-index.json <<<"$assets"; then
            gh release download plugin-index --pattern plugin-index.json --dir "$work"
          else
            jq -n --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{format: 1, generated_at: $now, plugins: []}' > "$work/plugin-index.json"
          fi
      # No signing key here. Removes the listed ids from the (not yet signed) index; the matching release assets are
      # deleted only at the very end, after the new index is signed, verified and uploaded.
      - name: Remove plugin ids from the index
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/plugin-index"
          : > "$RUNNER_TEMP/remove-assets.txt"
          [ -s "$RUNNER_TEMP/remove-ids.txt" ] || exit 0
          ids="$(jq -R . "$RUNNER_TEMP/remove-ids.txt" | jq -sc .)"
          jq -r --argjson ids "$ids" '.plugins[] | select(.id as $i | $ids | index($i)) | "\(.id)\t\(.version)"' "$work/plugin-index.json" > "$RUNNER_TEMP/removed.tsv"
          while IFS=$'\t' read -r id version; do
            echo "::notice::removing $id $version from the plugin index"
            # New name and the legacy name of releases published before the rename.
            echo "$id-$version.uzplugin" >> "$RUNNER_TEMP/remove-assets.txt"
            echo "$id-$version.fbplugin" >> "$RUNNER_TEMP/remove-assets.txt"
          done < "$RUNNER_TEMP/removed.tsv"
          while read -r rid; do
            grep -q "^$rid"$'\t' "$RUNNER_TEMP/removed.tsv" || echo "::notice::$rid is not in the index; nothing to remove"
          done < "$RUNNER_TEMP/remove-ids.txt"
          jq --argjson ids "$ids" '.plugins |= map(select(.id as $i | $ids | index($i) | not))' "$work/plugin-index.json" > "$work/plugin-index.new.json"
          mv "$work/plugin-index.new.json" "$work/plugin-index.json"
      - name: Create the index release when missing
        if: env.RELEASE_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create plugin-index --title "Uzume plugin index" \
            --notes 'Signed index of official Uzume plugins (plugin-index.json + .sig) and the signed .uzplugin files. Read by Uzume servers; updated by the workflow "Publish plugin".' \
            --prerelease --latest=false
      # An existing release keeps its old title and notes ("FrameBeam plugin index"); set the current ones.
      - name: Update the index release title and notes
        if: env.RELEASE_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit plugin-index --title "Uzume plugin index" \
            --notes 'Signed index of official Uzume plugins (plugin-index.json + .sig) and the signed .uzplugin files. Read by Uzume servers; updated by the workflow "Publish plugin".'
      # No signing key in this step: it handles the untrusted downloaded zip (unzip, jq) and only writes the validated
      # list of plugin files for the signing step.
      - name: Download and validate the plugin
        if: inputs.repo != '' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_TOKEN: ${{ secrets.PLUGIN_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/plugin-index"
          src="$RUNNER_TEMP/plugin-src"
          rm -rf "$src"; mkdir -p "$src"
          # The token for the plugin repo: the PAT when set, else the workflow token.
          GH_TOKEN="${SRC_TOKEN:-$GH_TOKEN}" gh release download "$INPUT_TAG" --repo "$INPUT_REPO" --pattern '*.uzplugin' --pattern '*.fbplugin' --dir "$src"
          shopt -s nullglob
          # .uzplugin first: when a release carries both names of one plugin version, the .uzplugin wins (.fbplugin is legacy).
          files=("$src"/*.uzplugin "$src"/*.fbplugin)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::release $INPUT_TAG of $INPUT_REPO has no .uzplugin asset"; exit 1; }
          : > "$work/pending.tsv"
          for f in "${files[@]}"; do
            id="$(unzip -p "$f" manifest.json | jq -r '.id')"
            version="$(unzip -p "$f" manifest.json | jq -r '.version')"
            [[ "$id" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || { echo "::error::unexpected plugin id in $(basename "$f")"; exit 1; }
            [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::unexpected plugin version in $(basename "$f")"; exit 1; }
            if grep -qxF "$id" "$RUNNER_TEMP/remove-ids.txt"; then
              echo "::error::$id is both added and listed in remove_ids"; exit 1
            fi
            if grep -qxF "$id"$'\t'"$version" <(cut -f1,2 "$work/pending.tsv"); then
              echo "::notice::$id $version appears twice in the release; using the first file, skipping $(basename "$f")"
              continue
            fi
            printf '%s\t%s\t%s\n' "$id" "$version" "$f" >> "$work/pending.tsv"
          done
      - name: Sign and add the plugin
        if: inputs.repo != '' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UZUME_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/plugin-index"
          sign="$RUNNER_TEMP/bin/uzume-sign"
          while IFS=$'\t' read -r id version f; do
            out="$work/$id-$version.uzplugin"
            # A published version is immutable: never replace its file (Hubs keep the old one and run pins name its sha256).
            if gh release view plugin-index --json assets -q '.assets[].name' | grep -qxF -e "$id-$version.uzplugin" -e "$id-$version.fbplugin"; then
              echo "::notice::$id $version is already published; skipped (publish a new version instead)"
              continue
            fi
            "$sign" plugin-sign -in "$f" -out "$out"
            "$sign" plugin-add -index "$work/plugin-index.json" -plugin "$out" \
              -url "https://github.com/$GH_REPO/releases/download/plugin-index/$id-$version.uzplugin"
            gh release upload plugin-index "$out"
          done < "$work/pending.tsv"
      - name: Sign and publish the index
        env:
          GH_TOKEN: ${{ github.token }}
          UZUME_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/plugin-index"
          sign="$RUNNER_TEMP/bin/uzume-sign"
          # Every publish (and the weekly run) re-stamps generated_at/expires_at; the plugin list is unchanged by this.
          "$sign" index-refresh -index "$work/plugin-index.json"
          "$sign" sign -index "$work/plugin-index.json" -out "$work/plugin-index.json.sig" -bundle "$work/plugin-index.json.signed"
          pub="$("$sign" pubkey | sed -n 's/^public_key=//p' | head -n 1)"
          [ -n "$pub" ] || { echo "::error::could not derive the public key"; exit 1; }
          "$sign" verify -index "$work/plugin-index.json" -sig "$work/plugin-index.json.sig" -pub "$pub"
          "$sign" verify -index "$work/plugin-index.json" -bundle "$work/plugin-index.json.signed" -pub "$pub"
          jq -r '.plugins[] | "\(.id) \(.version)"' "$work/plugin-index.json"
          # The bundle (one file, domain-separated signature) first, then the legacy pair for Hubs before ADR 0016's 2026-10-19 amendment.
          gh release upload plugin-index "$work/plugin-index.json.signed" --clobber
          gh release upload plugin-index "$work/plugin-index.json" "$work/plugin-index.json.sig" --clobber
      - name: Delete the files of removed plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/remove-assets.txt" ] || exit 0
          existing="$(gh release view plugin-index --json assets --jq '.assets[].name')"
          while read -r name; do
            if grep -qxF "$name" <<<"$existing"; then
              gh release delete-asset plugin-index "$name" --yes
              echo "::notice::deleted release asset $name"
            else
              echo "::notice::release asset $name not found; skipped"
            fi
          done < "$RUNNER_TEMP/remove-assets.txt"
