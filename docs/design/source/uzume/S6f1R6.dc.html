<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server status</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/uzume/tokens.css">
<link rel="stylesheet" href="ds/uzume/components/bundle.css">
<script src="ds/uzume/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
.wide, .wide *{letter-spacing:.09em !important; word-spacing:.18em}
</style>
</helmet>
<div class="uz" data-theme="sumi" style="width: 1280px; height: 800px; display: flex; background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
  <div style="width: 232px; height: 800px; flex: none">
    <x-import component-from-global-scope="Uzume.AppNav" active="Status" density="compact" online="{{online}}" user="{{user}}" badges="{{badges}}" notifications="{{three}}" style="height: 800px"></x-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 32px 56px 0 40px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">
    <x-import component-from-global-scope="Uzume.PageHeader" label="Server" title="Status" meta="Uzume Server 0.19.4 · server.example.com:8443 · up 6 days" actions="{{headActions}}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font: 500 11px/16px var(--font-mono); letter-spacing: .14em; color: var(--muted)">NEEDS ATTENTION · 3</span>
      <div style="display: flex; flex-direction: column; border-top: 1px solid var(--rule)">
        <sc-for list="{{issues}}" as="i" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 16px; min-height: 44px; border-bottom: 1px solid var(--rule-2); padding: 0 4px">
            <span style="flex: 1; min-width: 0"><x-import component-from-global-scope="Uzume.StatusIcon" kind="warning" size="sm">{{i.text}}</x-import></span>
            <x-import component-from-global-scope="Uzume.Button" size="sm">{{i.action}}</x-import>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 32px">
      <sc-for list="{{health}}" as="h" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--rule-2)">
          <span style="font: 400 12px/16px var(--font-mono); color: var(--muted)">{{h.k}}</span>
          <span style="font: 400 15px/22px var(--font-sans); color: var(--ink)">{{h.v}}</span>
        </div>
      </sc-for>
    </div>
    <button type="button" aria-expanded="false" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--ink-2); font: 500 13px/20px var(--font-sans); cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6 L8 11 L13 6" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>Help<span style="font: 400 12px/16px var(--font-mono); color: var(--muted)">WHAT THE CONNECTION CHECK TESTS</span>
    </button>
    <div style="border: 1px dashed var(--rule-control); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
      <span style="font: 500 11px/16px var(--font-mono); letter-spacing: .14em; color: var(--muted)">SAME HEADER, VERY WIDE FONT (SIMULATED, ABOUT 30 % WIDER)</span>
      <div class="wide" style="width: 720px">
        <x-import component-from-global-scope="Uzume.PageHeader" label="Server" title="Status" meta="Uzume Server 0.19.4 · server.example.com:8443 · up 6 days" actions="{{headActions}}"></x-import>
      </div>
      <span style="font: 400 12px/16px var(--font-sans); color: var(--ink-2)">The actions drop below the title; the title and the meta line never shorten.</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement, U = window.Uzume;
    const headActions = U ? h(React.Fragment, null, h(U.Button, { size: 'sm' }, 'Connection check'), h(U.Button, { size: 'sm', variant: 'primary' }, 'Back up now')) : null;
    return {
      three: 3, headActions,
      badges: { Status: { warning: 'Backup' }, 'Systems & cores': { warning: '1 core' }, Settings: { warning: 'Update' } },
      issues: [
        { text: 'The backup disk is 92 % full. The next backup may fail.', action: 'Free up space' },
        { text: 'Azahar could not be downloaded for 3DS. Players cannot start 3DS games.', action: 'Retry download' },
        { text: 'Server update 0.19.5 is ready to install.', action: 'Open settings' }
      ],
      health: [
        { k: 'SESSIONS NOW', v: '2 running · 3 watching' }, { k: 'USERS ONLINE', v: '2 of 4' }, { k: 'RELAY', v: 'On · used by 1 person' },
        { k: 'LIBRARY', v: '48 GB · 132 games' }, { k: 'SAVES', v: '2.1 GB · last backup 2 days ago' }, { k: 'CONNECTION CHECK', v: 'Passed 3 days ago' }
      ],
      online: [{ name: 'Max', person: 'wasurenagusa', playing: 'Harbor Rally', system: 'GBA' }, { name: 'Jonas', person: 'moegi' }],
      user: { name: 'Lena', role: 'Admin', person: 'momo' }
    };
  }
}
</script>
</body>
</html>
