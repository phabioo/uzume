<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagnostics</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/uzume/tokens.css">
<link rel="stylesheet" href="ds/uzume/components/bundle.css">
<script src="ds/uzume/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="uz" data-theme="sumi" style="width: 1280px; height: 800px; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--rule)">
    <a href="S3c1R6.dc.html" style="font: 400 13px/20px var(--font-sans); color: var(--ink-2); text-decoration: none; white-space: nowrap">← Library</a>
    <span style="width: 1px; height: 20px; background: var(--rule); margin: 0 8px"></span>
    <span style="flex: 1; min-width: 0; font: 500 16px/24px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lumen Drift</span>
    <x-import component-from-global-scope="Uzume.SystemChip" system="NDS"></x-import>
    <span style="width: 16px"></span>
    <x-import component-from-global-scope="Uzume.Button" size="sm">Layout · Side by side</x-import>
    <x-import component-from-global-scope="Uzume.Button" size="sm">Multiview</x-import>
    <x-import component-from-global-scope="Uzume.Button" size="sm" aria-pressed="false">Panel</x-import>
    <button type="button" aria-label="Fullscreen" title="Fullscreen · F11" style="width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: 1px solid var(--rule-control); color: var(--ink); padding: 0; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6 V2 H6 M10 2 H14 V6 M14 10 V14 H10 M6 14 H2 V10" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>
    </button>
    <x-import component-from-global-scope="Uzume.Button" size="sm" variant="primary">Pause</x-import>
    <x-import component-from-global-scope="Uzume.Menu" items="{{menu}}" label="More game actions"></x-import>
  </header>
  <div style="flex: 1; min-height: 0; background: var(--stage); position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding-right: 380px">
    <div role="img" aria-label="Top screen, 256 × 192" style="width: 384px; height: 288px; background: #0e0d0c; border: 1px solid var(--rule-2); display: grid; place-items: center; font: 400 12px/16px var(--font-mono); color: var(--muted)">256 × 192</div>
    <div role="img" aria-label="Bottom screen, 256 × 192" style="width: 384px; height: 288px; background: #0e0d0c; border: 1px solid var(--rule-2); display: grid; place-items: center; font: 400 12px/16px var(--font-mono); color: var(--muted)">256 × 192</div>

    <section aria-label="Diagnostics" style="position: absolute; top: 24px; right: 24px; width: 340px; background: var(--surface); border: 1px solid var(--rule); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font: 500 11px/16px var(--font-mono); letter-spacing: .14em; color: var(--muted); flex: 1">DIAGNOSTICS</span>
        <x-import component-from-global-scope="Uzume.Button" size="sm" variant="ghost">Copy</x-import>
        <button type="button" aria-label="Close diagnostics" style="width: 28px; height: 28px; background: none; border: 0; color: var(--ink-2); cursor: pointer">✕</button>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{summary}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--rule-2)">
            <span style="font: 400 12px/18px var(--font-mono); color: var(--muted)">{{r.k}}</span>
            <span style="font: 500 12px/18px var(--font-mono); color: var(--ink)">{{r.v}}</span>
          </div>
        </sc-for>
      </div>
      <x-import component-from-global-scope="Uzume.StatusIcon" kind="warning" size="sm">Jonas is connected through the relay.</x-import>
      <button type="button" aria-expanded="true" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--ink); font: 500 13px/20px var(--font-sans); cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10 L8 5 L13 10" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>Details
      </button>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{details}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; justify-content: space-between; gap: 12px; padding: 4px 0">
            <span style="font: 400 12px/18px var(--font-mono); color: var(--muted)">{{r.k}}</span>
            <span style="font: 400 12px/18px var(--font-mono); color: var(--ink-2); text-align: right">{{r.v}}</span>
          </div>
        </sc-for>
      </div>
      <div role="table" aria-label="Connections" style="display: flex; flex-direction: column; border-top: 1px solid var(--rule)">
        <div role="row" style="display: grid; grid-template-columns: 64px 64px 56px 1fr; gap: 8px; padding: 6px 0; font: 500 11px/16px var(--font-mono); letter-spacing: .1em; color: var(--muted)">
          <span role="columnheader">PERSON</span><span role="columnheader">PATH</span><span role="columnheader">RTT</span><span role="columnheader">LOSS</span>
        </div>
        <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
          <div role="row" style="display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border-top: 1px solid var(--rule-2)">
            <div style="display: grid; grid-template-columns: 64px 64px 56px 1fr; gap: 8px; font: 400 12px/18px var(--font-mono); color: var(--ink)">
              <span role="cell">{{p.name}}</span><span role="cell">{{p.path}}</span><span role="cell">{{p.rtt}}</span><span role="cell">{{p.loss}}</span>
            </div>
            <sc-if value="{{p.reason}}" hint-placeholder-val="{{false}}">
              <span style="font: 400 12px/16px var(--font-sans); color: var(--ink-2)">{{p.reason}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="position: absolute; left: 48px; bottom: 32px; display: flex; flex-direction: column; gap: 8px">
      <span style="font: 500 11px/16px var(--font-mono); letter-spacing: .14em; color: var(--muted)">WHILE SELECT IS HELD</span>
      <x-import component-from-global-scope="Uzume.HotkeySheet" keys="{{keys}}"></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      menu: [{ label: 'Diagnostics', shortcut: 'F3' }, { label: 'Screenshot', shortcut: 'F12' }, { label: 'Hotkeys' }, { label: 'Reset game …' }, { separator: true }, { label: 'Report a problem …' }],
      summary: [{ k: 'FPS', v: '59.8' }, { k: 'FRAME TIME', v: '16.7 MS' }, { k: 'AUDIO', v: 'OK · 42 MS BUFFER' }, { k: 'SESSION', v: '3 WATCHING' }],
      details: [{ k: 'ENCODER', v: 'NVENC H.264 · GPU DIRECT' }, { k: 'BITRATE', v: '8.2 MBIT/S' }, { k: 'RESOLUTION', v: '1024 × 768 · 60 FPS' }],
      people: [
        { name: 'Max', path: 'DIRECT', rtt: '18 MS', loss: '0.1 %' },
        { name: 'Jonas', path: 'RELAY', rtt: '64 MS', loss: '1.2 %', reason: 'Relay because no direct path was found: both networks use strict NAT.' },
        { name: 'Sam', path: 'DIRECT', rtt: '27 MS', loss: '0.0 %' }
      ],
      keys: [['A', 'Save state'], ['B', 'Load state'], ['L', 'Previous slot'], ['R', 'Next slot'], ['X', 'Screenshot'], ['Y', 'Fast forward'], ['R3', 'Diagnostics'], ['Start', 'Pause menu']]
    };
  }
}
</script>
</body>
</html>
